<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lexicon Quest — Путь Авантюриста</title>
<style>
/* ===== ЭТАП ГЛОБАЛЬНЫЕ СТИЛИ ===== */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --bg:#0a0612; --panel:#1a1230; --panel2:#241a40;
  --accent:#8b5cf6; --accent2:#ec4899; --gold:#fbbf24;
  --hp:#ef4444; --green:#22c55e;
  --text:#e9e3ff; --muted:#8b7fb0;
  --rankE:#9ca3af; --rankD:#22c55e; --rankC:#3b82f6;
  --rankB:#a855f7; --rankA:#f59e0b; --rankS:#ec4899;
  --rankSS:#ef4444; --rankSSS:#fbbf24;
}
html,body {
  height:100%; background:var(--bg); color:var(--text);
  font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
  overflow:hidden; user-select:none;
}
#app {
  width:100%; height:100vh; height:100dvh; max-width:520px;
  margin:0 auto; position:relative; display:flex; flex-direction:column;
  background: radial-gradient(ellipse at top, #1a1030 0%, #0a0612 70%);
  overflow:hidden;
}
.screen { display:none; flex-direction:column; flex:1; overflow:hidden; }
.screen.active { display:flex; }
/* ===== ЭТАП ГЛОБАЛЬНЫЕ СТИЛИ ЗАВЕРШЕН ===== */

/* ===== ЭТАП HUD ===== */
.hud {
  display:flex; gap:8px; padding:10px 12px;
  background:rgba(10,6,18,0.9);
  border-bottom:1px solid rgba(139,92,246,0.3);
  align-items:center; flex-shrink:0;
}
.hud .hp-wrap { flex:1; display:flex; align-items:center; gap:6px; min-width:0; }
.hud .hp-icon { font-size:14px; }
.hud .bar { flex:1; height:10px; background:#000; border-radius:5px; overflow:hidden; }
.hud .bar > div { height:100%; transition:width .35s ease; }
.hud .hp > div { background:linear-gradient(90deg,#ef4444,#f87171); }
.hud .gold {
  color:var(--gold); font-weight:700; font-size:13px;
  display:flex; align-items:center; gap:3px;
}
.hud .level-btn {
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none; border-radius:10px; padding:5px 9px;
  display:flex; flex-direction:column; align-items:center;
  color:#fff; cursor:pointer; font-weight:800;
  box-shadow:0 2px 12px rgba(139,92,246,.5);
  min-width:48px;
}
.hud .level-btn .lbl { font-size:7px; letter-spacing:1px; opacity:.85; }
.hud .level-btn .num { font-size:17px; line-height:1; }
.hud .rank-badge {
  display:flex; flex-direction:column; align-items:center;
  padding:4px 8px; border-radius:8px; background:var(--panel2);
  border:1px solid currentColor; font-size:9px; letter-spacing:1px;
  font-weight:800; min-width:38px;
}
.hud .rank-badge .r-lbl { opacity:.6; }
.hud .rank-badge .r-val { font-size:16px; line-height:1; }
/* ===== ЭТАП HUD ЗАВЕРШЕН ===== */

/* ===== ЭТАП КНОПКИ ===== */
button {
  font-family:inherit; cursor:pointer; border:none; color:var(--text);
  background:var(--panel2); padding:12px 18px; border-radius:10px;
  font-size:15px; font-weight:600; transition:transform .1s;
  border:1px solid rgba(139,92,246,0.3);
}
button:active { transform:scale(.96); }
button.primary {
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none; box-shadow:0 4px 20px rgba(139,92,246,0.4);
}
button:disabled { opacity:.4; cursor:not-allowed; }
button.ghost { background:transparent; border:1px solid rgba(139,92,246,0.4); }
/* ===== ЭТАП КНОПКИ ЗАВЕРШЕН ===== */

/* ===== ЭТАП ИНТРО ===== */
#intro { padding:30px 24px; justify-content:center; text-align:center; gap:16px; }
#intro h1 {
  font-size:30px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  letter-spacing:1px;
}
#intro .sub { color:var(--muted); font-size:12px; letter-spacing:3px; text-transform:uppercase; }
#intro .story { font-size:15px; line-height:1.7; opacity:.92; min-height:150px; }
#intro .story em { color:var(--accent2); font-style:normal; }
/* ===== ЭТАП ИНТРО ЗАВЕРШЕН ===== */

/* ===== ЭТАП СКРОЛЛ ===== */
.scroll { flex:1; overflow-y:auto; padding:16px; }
.scroll::-webkit-scrollbar { width:6px; }
.scroll::-webkit-scrollbar-thumb { background:var(--accent); border-radius:3px; }
.section-title {
  font-size:12px; color:var(--muted); text-transform:uppercase;
  letter-spacing:2px; margin:18px 0 10px; font-weight:700;
}
.section-title:first-child { margin-top:0; }
/* ===== ЭТАП СКРОЛЛ ЗАВЕРШЕН ===== */

/* ===== ЭТАП КАРТОЧКИ ЭТАПОВ ===== */
.stage-card {
  background:var(--panel); border:1px solid rgba(139,92,246,0.25);
  border-radius:14px; padding:14px 16px; margin-bottom:10px;
  display:flex; align-items:center; gap:14px;
  transition:transform .15s;
}
.stage-card.locked { opacity:.4; }
.stage-card.done { border-color:rgba(34,197,94,0.5); }
.stage-card.available { cursor:pointer; }
.stage-card.available:active { transform:scale(.98); }
.stage-card .sico { font-size:26px; width:34px; text-align:center; }
.stage-card .info { flex:1; min-width:0; }
.stage-card .info h3 { font-size:15px; margin-bottom:2px; }
.stage-card .info p { font-size:12px; color:var(--muted); }
.stage-card .sstate { font-size:18px; }

.stage-card.boss {
  background:linear-gradient(135deg, rgba(139,92,246,0.2), rgba(236,72,153,0.15));
  border:1px solid var(--accent2);
  box-shadow:0 0 20px rgba(236,72,153,0.2);
}
.stage-card.exam {
  background:linear-gradient(135deg, rgba(251,191,36,0.15), rgba(239,68,68,0.1));
  border:1px solid var(--gold);
  box-shadow:0 0 20px rgba(251,191,36,0.25);
}
/* ===== ЭТАП КАРТОЧКИ ЭТАПОВ ЗАВЕРШЕН ===== */

/* ===== ЭТАП ДИАЛОГ ===== */
.speech {
  background:var(--panel); border:1px solid rgba(139,92,246,0.3);
  border-radius:14px; padding:14px 16px; margin:8px 0 16px;
  font-size:14px; line-height:1.5;
}
.speech .en { color:var(--accent2); font-style:italic; font-weight:600; margin-bottom:6px; }
.speech .ru { color:var(--text); }
.speech .npc-name {
  font-size:10px; text-transform:uppercase; letter-spacing:2px;
  color:var(--muted); margin-bottom:6px;
}

.chat { padding:16px; display:flex; flex-direction:column; gap:12px; }
.chat .bubble {
  max-width:80%; padding:12px 16px; border-radius:16px;
  font-size:14px; line-height:1.5;
  animation:bubbleIn .35s ease-out;
}
.chat .bubble.left {
  align-self:flex-start;
  background:var(--panel); border:1px solid rgba(139,92,246,.3);
  border-bottom-left-radius:4px;
}
.chat .bubble.right {
  align-self:flex-end;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-bottom-right-radius:4px;
}
.chat .bubble .speaker { font-size:10px; text-transform:uppercase; letter-spacing:1px; opacity:.7; margin-bottom:4px; }
.chat .bubble .line { font-size:15px; font-weight:600; margin-bottom:4px; }
.chat .bubble .trans { font-size:12px; opacity:.75; font-style:italic; }
@keyframes bubbleIn {
  from { opacity:0; transform:translateY(10px); }
  to { opacity:1; transform:translateY(0); }
}
/* ===== ЭТАП ДИАЛОГ ЗАВЕРШЕН ===== */

/* ===== ЭТАП СЛОВАРЬ ===== */
.word-row {
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; background:var(--panel);
  border-radius:10px; margin-bottom:6px;
  border:1px solid rgba(139,92,246,0.15);
  font-size:14px;
}
.word-row .idx { color:var(--muted); font-size:11px; width:22px; }
.word-row .en { font-weight:700; flex:1; min-width:0; }
.word-row .pos {
  font-size:10px; color:var(--accent2); background:rgba(236,72,153,.15);
  padding:2px 6px; border-radius:4px; margin-left:4px;
  font-weight:700;
}
.word-row .tr { color:var(--muted); font-size:11px; font-style:italic; font-weight:400; }
.word-row .ru { color:var(--text); text-align:right; }
.word-row .spk { background:none; border:none; padding:4px 6px; font-size:15px; }
/* ===== ЭТАП СЛОВАРЬ ЗАВЕРШЕН ===== */

/* ===== ЭТАП ВОПРОС ===== */
.prompt-word { text-align:center; padding:20px 16px 10px; }
.prompt-word .word { font-size:34px; font-weight:800; letter-spacing:1px; transition:opacity .15s; }
.prompt-word .sub { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:2px; }
.prompt-word .word.fade { opacity:0; }

.answers {
  padding:0 16px 16px; display:grid;
  grid-template-columns:1fr 1fr; gap:10px;
}
.answers button {
  padding:18px 8px; font-size:15px;
  background:var(--panel); border:1.5px solid rgba(139,92,246,0.3);
  border-radius:12px;
}
.answers button.correct { background:rgba(34,197,94,0.25); border-color:#22c55e; }
.answers button.wrong { background:rgba(239,68,68,0.25); border-color:#ef4444; }

.progress-label {
  text-align:center; font-size:12px; color:var(--muted);
  padding:8px 16px; letter-spacing:1px;
}
/* ===== ЭТАП ВОПРОС ЗАВЕРШЕН ===== */

/* ===== ЭТАП БОЙ ===== */
.enemy-area {
  padding:16px 20px; text-align:center; position:relative;
  background:radial-gradient(ellipse at center, rgba(239,68,68,0.15), transparent 70%);
  flex-shrink:0;
}
.enemy-area.dummy { background:radial-gradient(ellipse at center, rgba(251,191,36,0.15), transparent 70%); }
.enemy-area.peaceful { background:radial-gradient(ellipse at center, rgba(34,197,94,0.12), transparent 70%); }
.enemy-sprite {
  font-size:64px; display:inline-block;
  transition:transform .15s;
  filter:drop-shadow(0 0 20px rgba(239,68,68,0.6));
}
.enemy-area.dummy .enemy-sprite { filter:drop-shadow(0 0 20px rgba(251,191,36,0.6)); }
.enemy-area.peaceful .enemy-sprite { filter:drop-shadow(0 0 20px rgba(34,197,94,0.6)); }
.enemy-sprite.hit { transform:scale(.85) rotate(-8deg); filter:drop-shadow(0 0 30px rgba(255,255,255,.9)); }
.enemy-sprite.attack { transform:translateY(15px) scale(1.1); }
.enemy-name { font-size:13px; font-weight:700; margin-top:4px; }
.enemy-hp { height:8px; background:#000; border-radius:4px; overflow:hidden; max-width:240px; margin:6px auto 0; }
.enemy-hp > div { height:100%; background:linear-gradient(90deg,#ef4444,#fca5a5); transition:width .3s; }
.enemy-area.dummy .enemy-hp > div { background:linear-gradient(90deg,#fbbf24,#fcd34d); }
.enemy-area.peaceful .enemy-hp { display:none; }

.slash {
  position:absolute; left:50%; top:50%;
  width:180px; height:8px;
  background:linear-gradient(90deg, transparent, #fff, transparent);
  transform:translate(-50%,-50%) rotate(-30deg) scaleX(0);
  transform-origin:center;
  pointer-events:none;
  border-radius:4px;
  opacity:0;
}
.slash.fire {
  animation:slashAnim .35s ease-out;
  box-shadow:0 0 20px rgba(255,255,255,.9), 0 0 40px rgba(139,92,246,.7);
}
@keyframes slashAnim {
  0% { transform:translate(-50%,-50%) rotate(-30deg) scaleX(0); opacity:1; }
  50% { transform:translate(-50%,-50%) rotate(-30deg) scaleX(1); opacity:1; }
  100% { transform:translate(-50%,-50%) rotate(-30deg) scaleX(1); opacity:0; }
}

.timer-bar { height:5px; background:#000; border-radius:3px; margin:10px 16px 0; overflow:hidden; }
.timer-bar > div { height:100%; background:linear-gradient(90deg,#22d3ee,#8b5cf6); width:100%; }
/* ===== ЭТАП БОЙ ЗАВЕРШЕН ===== */

/* ===== ЭТАП МОДАЛКА ===== */
.modal-bg {
  position:fixed; inset:0; background:rgba(0,0,0,.85);
  display:none; align-items:center; justify-content:center; padding:20px;
  z-index:100;
}
.modal-bg.show { display:flex; }
.modal {
  background:var(--panel); border:1px solid var(--accent);
  border-radius:18px; padding:24px; max-width:400px; width:100%;
  text-align:center;
  animation:popIn .25s cubic-bezier(.34,1.56,.64,1);
  max-height:90vh; overflow-y:auto;
}
@keyframes popIn { from{transform:scale(.85);opacity:0;} to{transform:scale(1);opacity:1;} }
.modal h2 { font-size:22px; margin-bottom:10px; }
.modal h2.win { color:#22c55e; }
.modal h2.lose { color:#ef4444; }
.modal h2.goddess { color:var(--accent2); }
.modal h2.gold { color:var(--gold); }
.modal p { color:var(--muted); font-size:14px; margin-bottom:16px; line-height:1.5; }
.modal p em { color:var(--text); font-style:italic; }
.modal .rewards { display:flex; justify-content:center; gap:16px; margin:16px 0; flex-wrap:wrap; }
.modal .rewards .r { display:flex; flex-direction:column; gap:2px; font-size:12px; color:var(--muted); }
.modal .rewards .r span:first-child { font-size:20px; color:var(--text); font-weight:800; }
.modal button { width:100%; margin-top:8px; }
/* ===== ЭТАП МОДАЛКА ЗАВЕРШЕН ===== */

/* ===== ЭТАП FLOAT-TEXT ===== */
.float-text {
  position:absolute; font-weight:800; font-size:22px;
  pointer-events:none; animation:floatUp .9s ease-out forwards;
  text-shadow:0 2px 8px rgba(0,0,0,.8); z-index:50;
}
@keyframes floatUp {
  0% { transform:translate(-50%,0) scale(.8); opacity:1; }
  100% { transform:translate(-50%,-60px) scale(1.2); opacity:0; }
}
/* ===== ЭТАП FLOAT-TEXT ЗАВЕРШЕН ===== */

/* ===== ЭТАП NAV ===== */
.nav {
  display:flex; background:rgba(10,6,18,.95);
  border-top:1px solid rgba(139,92,246,.3); flex-shrink:0;
}
.nav button {
  flex:1; background:none; border:none; border-radius:0;
  padding:8px 4px; font-size:10px; color:var(--muted);
  display:flex; flex-direction:column; align-items:center; gap:3px; font-weight:600;
}
.nav button.active { color:var(--accent); }
.nav button .ico { font-size:19px; }
/* ===== ЭТАП NAV ЗАВЕРШЕН ===== */

/* ===== ЭТАП БАННЕР + ПРОФИЛЬ ===== */
.banner { text-align:center; padding:14px 16px 4px; }
.banner h2 { font-size:18px; margin-bottom:2px; }
.banner p { font-size:12px; color:var(--muted); }

.profile-header {
  text-align:center; padding:24px 16px;
  background:radial-gradient(ellipse at center, rgba(139,92,246,0.2), transparent 70%);
}
.profile-avatar { font-size:72px; }
.profile-name { font-size:20px; font-weight:800; margin-top:4px; }
.profile-lvl {
  display:inline-block; margin-top:8px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  padding:6px 18px; border-radius:20px;
  font-size:14px; font-weight:800;
  box-shadow:0 4px 16px rgba(139,92,246,.4);
}
.stat-grid {
  display:grid; grid-template-columns:1fr 1fr; gap:10px;
  padding:0 16px;
}
.stat-box {
  background:var(--panel); border:1px solid rgba(139,92,246,0.25);
  border-radius:12px; padding:14px; text-align:center;
}
.stat-box .ico { font-size:24px; }
.stat-box .val { font-size:24px; font-weight:800; color:var(--text); margin-top:4px; }
.stat-box .lbl { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
/* ===== ЭТАП БАННЕР + ПРОФИЛЬ ЗАВЕРШЕН ===== */

/* ===== ЭТАП РАНГ-КАРТОЧКА ===== */
.rank-card {
  background:var(--panel); border:2px solid currentColor;
  border-radius:14px; padding:16px; margin-bottom:10px;
  display:flex; align-items:center; gap:14px;
  box-shadow:0 0 20px rgba(139,92,246,.15);
}
.rank-card.locked { opacity:.35; }
.rank-card.done { opacity:.85; }
.rank-card .r-big {
  font-size:36px; font-weight:900; width:60px; text-align:center;
  text-shadow:0 0 20px currentColor;
}
.rank-card .info { flex:1; }
.rank-card .info h3 { font-size:14px; margin-bottom:3px; }
.rank-card .info p { font-size:11px; color:var(--muted); }
.rank-card .r-status { font-size:20px; }
/* ===== ЭТАП РАНГ-КАРТОЧКА ЗАВЕРШЕН ===== */

/* ===== ЭТАП ЭКЗАМЕН-ВЫБОР ===== */
.exam-mode {
  display:flex; flex-direction:column; gap:12px; padding:20px;
  align-items:center; text-align:center;
}
.exam-mode h2 { font-size:22px; margin-bottom:8px; }
.exam-mode p { color:var(--muted); font-size:13px; margin-bottom:14px; }
.exam-mode button { width:100%; max-width:300px; }
/* ===== ЭТАП ЭКЗАМЕН-ВЫБОР ЗАВЕРШЕН ===== */

/* ===== ЭТАП ФРАЗА-СБОРКА ===== */
.phrase-area {
  padding:16px; display:flex; flex-direction:column; gap:12px;
  flex:1;
}
.phrase-target {
  background:var(--panel); border:2px dashed rgba(139,92,246,0.4);
  border-radius:12px; min-height:70px; padding:14px;
  display:flex; flex-wrap:wrap; gap:8px;
  align-content:flex-start;
  transition:border-color .2s, background .2s;
}
.phrase-target.valid { border-color:#22c55e; background:rgba(34,197,94,0.08); }
.phrase-target.invalid { border-color:#ef4444; background:rgba(239,68,68,0.08); }
.phrase-target .hint { color:var(--muted); font-size:13px; }
.word-chip {
  background:var(--panel2);
  border:1px solid rgba(139,92,246,0.4);
  border-radius:8px;
  padding:8px 12px;
  font-size:15px; font-weight:600;
  cursor:pointer;
  transition:transform .1s, opacity .2s;
}
.word-chip:active { transform:scale(.94); }
.word-chip.in-target {
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;
}
.word-pool {
  display:flex; flex-wrap:wrap; gap:8px;
  padding:12px;
  background:rgba(10,6,18,0.5);
  border-radius:12px;
  min-height:60px;
}
/* ===== ЭТАП ФРАЗА-СБОРКА ЗАВЕРШЕН ===== */

.empty { color:var(--muted); text-align:center; padding:30px; font-size:13px; }
</style>
</head>
<body>
<div id="app">

  <!-- ===== ЭТАП ЭКРАН ИНТРО ===== -->
  <div id="intro" class="screen active">
    <div class="sub">LEXICON QUEST</div>
    <h1>Путь Авантюриста</h1>
    <div class="story" id="storyText"></div>
    <button class="primary" id="startBtn" style="display:none">Очнуться</button>
  </div>
  <!-- ===== ЭТАП ЭКРАН ИНТРО ЗАВЕРШЕН ===== -->

  <!-- ===== ЭТАП ИГРА ===== -->
  <div id="game" class="screen" style="display:none">
    <div class="hud">
      <div class="hp-wrap">
        <span class="hp-icon">❤️</span>
        <div class="bar hp"><div id="hpBar" style="width:100%"></div></div>
      </div>
      <div class="gold">🪙 <span id="goldVal">0</span></div>
      <button class="rank-badge" id="rankBadge" style="color:var(--rankE)">
        <span class="r-lbl">RANK</span>
        <span class="r-val" id="rankVal">—</span>
      </button>
      <button class="level-btn" id="levelBtn">
        <span class="lbl">LVL</span>
        <span class="num" id="lvlVal">1</span>
      </button>
    </div>

    <!-- ЭКРАН КАРТА -->
    <div id="screen-map" class="screen active">
      <div class="scroll" id="mapScroll"></div>
    </div>

    <!-- ЭКРАН СЛОВАРЬ -->
    <div id="screen-words" class="screen">
      <div class="scroll" id="wordsScroll"></div>
      <div style="padding:12px 16px; flex-shrink:0;">
        <button class="primary" id="wordsDoneBtn" style="width:100%">Я запомнил →</button>
      </div>
    </div>

    <!-- ЭКРАН ТЕСТ -->
    <div id="screen-test" class="screen">
      <div class="progress-label" id="testProgress">Проверка 1 / 20</div>
      <div class="prompt-word">
        <div class="sub">Переведи слово</div>
        <div class="word" id="testWord">water</div>
      </div>
      <div class="answers" id="testAnswers"></div>
    </div>

    <!-- ЭКРАН БОЙ -->
    <div id="screen-battle" class="screen">

   БЛОК 4 — ЯДРО ИГРЫ

// ===== ЭТАП СОСТОЯНИЕ =====
let state;

function defaultState(){
  return {
    // Прогресс
    level: 1,
    gold: 0,
    hp: 100,
    maxHp: 100,
    rank: null,                    // null = нет ранга (ещё не в Гильдии)
    act: 1,                        // текущий акт: 1..4

    // Знания
    learned: [],                   // массив id выученных слов
    learnedGoddess: false,         // получил ли слова от богини

    // Прогресс по актам
    act1: {
      completedModules: [],        // id пройденных модулей (a1m1..a1m8)
      forestCleared: [],           // id пройденных монстров ('mon0'..'mon7')
      bossDefeated: false,
      oldManDialogueDone: false,   // прошёл ли финальный диалог
      hasLetter: false,            // есть ли письмо профессору
    },
    act2: {
      goddessDone: false,          // диалог с богиней
      guardianDone: false,         // диалог со стражником
      completedModules: [],        // id пройденных модулей (a2m0..a2m8)
      citizenRank: false,          // получил ли гражданство
    },
    act3: {
      entered: false,              // вошёл ли в Академию
      completedModules: [],        // id пройденных модулей (a3m1..a3m14)
      graduated: false,            // выпускник Академии
      professorMet: false,         // показал ли письмо профессору
    },
    act4: {
      joined: false,               // вступил в Гильдию
      completedModules: [],        // id пройденных модулей (a4m1..a4m6)
      guildMasterMet: false,       // диалог с мастером
      questsDone: [],              // id выполненных квестов
    },

    // Ранги и экзамены
    passedExams: [],               // id сданных экзаменов ('basic'..'native')

    // Статистика
    stats: {
      dummiesBroken: 0,
      monstersKilled: 0,
      bossesDefeated: 0,
      battlesWon: 0,
      mistakes: 0,
      examsPassed: 0,
      examsFailed: 0,
      // Подсчёт ошибочных слов для адаптивности
      wrongWordIds: {},
    },
  };
}

function save(){
  try {
    localStorage.setItem('lexicon_v5', JSON.stringify(state));
  } catch(e){ /* ignore quota errors */ }
}
function load(){
  const s = localStorage.getItem('lexicon_v5');
  if (s) {
    try {
      state = JSON.parse(s);
      // Мягкая миграция, если из старой версии
      if (!state.stats) state.stats = defaultState().stats;
      if (!state.act1) state.act1 = defaultState().act1;
      if (!state.act2) state.act2 = defaultState().act2;
      if (!state.act3) state.act3 = defaultState().act3;
      if (!state.act4) state.act4 = defaultState().act4;
      if (!state.passedExams) state.passedExams = [];
      return true;
    } catch(e){ /* fallthrough */ }
  }
  return false;
}
// ===== ЭТАП СОСТОЯНИЕ ЗАВЕРШЕН =====

// ===== ЭТАП УТИЛИТЫ =====
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function randInt(a, b){ return Math.floor(Math.random() * (b - a + 1)) + a; }

function shuffle(a){
  const r = [...a];
  for (let i = r.length - 1; i > 0; i--){
    const j = randInt(0, i);
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
}

function wordFor(id){
  const w = WORD_BY_ID[id];
  if (!w) return { id, en: id, tr: '', ru: id, pos: '', ex: '' };
  return w;
}

function wordsFor(idList){
  return idList.map(id => wordFor(id));
}

// Проверка, есть ли слово в базе
function hasWord(id){ return !!WORD_BY_ID[id]; }

// Узнаём часть речи на русском
function posRu(pos){
  const map = { n:'сущ.', v:'глаг.', adj:'прил.', adv:'нареч.', pron:'мест.', prep:'предл.', conj:'союз', modal:'модал.', interj:'воскл.', phr:'фраза' };
  return map[pos] || pos;
}

function speak(text, lang){
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang || 'en-US';
  u.rate = 0.9;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function floatText(text, color, x, y){
  const el = document.createElement('div');
  el.className = 'float-text';
  el.textContent = text;
  el.style.color = color || '#fff';
  el.style.left = x || '50%';
  el.style.top = y || '30%';
  $('#app').appendChild(el);
  setTimeout(() => el.remove(), 900);
}

function setWordSmooth(el, text, cb){
  el.classList.add('fade');
  setTimeout(() => {
    el.textContent = text;
    el.classList.remove('fade');
    if (cb) cb();
  }, 150);
}

// Обучение слову — добавляем в learned, если ещё нет
function learnWord(id){
  if (!state.learned.includes(id)) {
    state.learned.push(id);
    save();
    return true;
  }
  return false;
}

// Отметить ошибку для адаптивности
function recordMistake(wordId){
  if (!wordId) return;
  state.stats.wrongWordIds[wordId] = (state.stats.wrongWordIds[wordId] || 0) + 1;
  state.stats.mistakes++;
  save();
}

// Проверка: сколько слов выучено
function learnedCount(){ return state.learned.length; }

// Выбрать случайное слово из массива id, приоритет — слова с ошибками
function weightedPick(ids){
  if (ids.length === 0) return null;
  // Считаем веса: слово с 0 ошибок = 1, с 1 ошибкой = 2, и т.д.
  const weighted = [];
  for (const id of ids){
    const mistakes = state.stats.wrongWordIds[id] || 0;
    const weight = 1 + mistakes * 2;
    for (let i = 0; i < weight; i++) weighted.push(id);
  }
  return weighted[randInt(0, weighted.length - 1)];
}

function updateHud(){
  $('#hpBar').style.width = Math.max(0, state.hp / state.maxHp * 100) + '%';
  $('#goldVal').textContent = state.gold;

  // Ранг

}

function switchMain(name){
  const screens = ['map','words','test','battle','profile','dialogue','choice','exam','phrase'];
  screens.forEach(n => {
    const el = document.getElementById('screen-' + n);
    if (el) el.classList.toggle('active', n === name);
  });

  // Nav показываем только на карте и в профиле

  $('#nav').style.display = showNav ? 'flex' : 'none';
  $$('#nav button').forEach(b => b.classList.toggle('active', b.dataset.screen === name));

// ===== ЭТАП ТЕСТ =====
function startTest(m){
  test = {
    module: m,
    queue: [...m.words],
    idx: 0,
    wrong: [],
    total: m.words.length,
  };
  renderTestQuestion();
  switchMain('test');
}

function renderTestQuestion(){
  if (test.idx >= test.queue.length) return finishTest();

  const id = test.queue[test.idx];
  const w = wordFor(id);

  $('#testProgress').textContent = `Проверка ${Math.min(test.idx + 1, test.total)} / ${test.total}`;
  setWordSmooth($('#testWord'), w.en);

  // Дистракторы: 3 случайных перевода из того же модуля
  const others = test.module.words.filter(x => x !== id);
  const wrongs = shuffle(others).slice(0, 3).map(x => wordFor(x).ru);
  const opts = shuffle([w.ru, ...wrongs]);

  const box = $('#testAnswers');
  box.innerHTML = '';
  opts.forEach(o => {
    const b = document.createElement('button');
    b.textContent = o;
    b.onclick = () => answerTest(b, o === w.ru);
    box.appendChild(b);
  });
}

function answerTest(btn, isCorrect){
  $$('#testAnswers button').forEach(b => b.disabled = true);
  const id = test.queue[test.idx];
  const w = wordFor(id);

  if (isCorrect){
    btn.classList.add('correct');
    learnWord(id);
    test.idx++;
    setTimeout(renderTestQuestion, 400);
  } else {
    btn.classList.add('wrong');
    recordMistake(id);
    // показываем правильный
    $$('#testAnswers button').forEach(b => {
      if (b.textContent === w.ru) b.classList.add('correct');
    });
    // слово вернётся в конец очереди
    test.queue.push(id);
    test.wrong.push(id);
    test.idx++;
    setTimeout(renderTestQuestion, 900);
  }
}

function finishTest(){
  const uniqueWrong = new Set(test.wrong).size;
  if (uniqueWrong > 8){
    showModal({
      title:'Ещё разок 📖',
      text:`Старик качает головой. Ты ошибся в ${uniqueWrong} словах. Перечитай их.`,
      btn:'К словарю',
      onBtn: () => { closeModal(); renderWordList(test.module); }
    });
    return;
  }
  showModal({
    title:'Готов к тренировке 🎯',
    text:'Старик указывает на деревянное чучело. Пора применить слова.',
    btn:'К манекену',
    onBtn: () => { closeModal(); startDummy(test.module); }
  });
}

// ===== ЭТАП ЛОГИКА БОЯ =====
function pickFromPool(){
  // Всегда из текущего пула модуля (не смешиваем с прошлыми)
  return wordFor(weightedPick(battle.wordPool));
}

function nextBattleQuestion(){
  if (!battle || !battle.active) return;

  const w = battle.type === 'boss' ? pickBossWord() : pickFromPool();
  if (!w) return;

  battle.currentWord = w;
  setWordSmooth($('#battleWord'), w.en);

  // Правильный перевод + 3 дистрактора
  const correct = w.ru;
  const allIds = battle.bossPool || battle.module.words;
  const allRu = allIds.map(id => wordFor(id).ru).filter(r => r !== correct);
  const wrongs = shuffle(allRu).slice(0, 3);
  const opts = shuffle([correct, ...wrongs]);

  const box = $('#battleAnswers');
  box.innerHTML = '';
  opts.forEach(o => {
    const b = document.createElement('button');
    b.textContent = o;
    b.onclick = () => answerBattle(b, o === correct);
    box.appendChild(b);
  });

  // Таймер: манекен 6 сек, монстр/босс 5 сек
  const secs = battle.type === 'dummy' ? 6 : 5;
  startTimer(secs, onBattleTimeout);
}

function startTimer(sec, onEnd){
  clearInterval(battle.timer);
  const bar = $('#timerBar');
  const start = performance.now();
  const total = sec * 1000;
  bar.style.width = '100%';
  battle.timer = setInterval(() => {
    const el = performance.now() - start;
    const left = Math.max(0, 1 - el / total);
    bar.style.width = (left * 100) + '%';
    if (left <= 0){
      clearInterval(battle.timer);
      onEnd();
    }
  }, 50);
}

function answerBattle(btn, isCorrect){
  clearInterval(battle.timer);
  if (!battle || !battle.active) return;
  $$('#battleAnswers button').forEach(b => b.disabled = true);

  if (isCorrect){
    btn.classList.add('correct');
    const w = battle.currentWord;
    learnWord(w.id);

    // Урон всегда 13 (для манекена — ровно 8 ударов)
    const dmg = 13;
    battle.enemyHp -= dmg;
    if (battle.type === 'dummy') battle.hitsLeft--;

    // Хил игроку
    const heal = Math.min(5, state.maxHp - state.hp);
    state.hp += heal;

    floatText('-' + dmg, '#fbbf24', '50%', '22%');
    if (heal > 0) setTimeout(() => floatText('+' + heal, '#22c55e', '35%', '55%'), 150);

    // Слэш
    const slash = $('#slash');
    slash.classList.remove('fire');
    void slash.offsetWidth;
    slash.classList.add('fire');

    const sprite = $('#enemySprite');
    sprite.classList.add('hit');
    setTimeout(() => sprite.classList.remove('hit'), 150);

    updateEnemyHp();
    updateHud();
    save();

    if (battle.enemyHp <= 0) return enemyDefeated();
    setTimeout(nextBattleQuestion, 550);
  } else {
    btn.classList.add('wrong');
    recordMistake(battle.currentWord.id);
    $$('#battleAnswers button').forEach(b => {
      if (b.textContent === battle.currentWord.ru) b.classList.add('correct');
    });
    onBattleWrong();
  }
}

function onBattleTimeout(){
  if (!battle || !battle.active) return;
  $$('#battleAnswers button').forEach(b => {
    b.disabled = true;
    if (b.textContent === battle.currentWord.ru) b.classList.add('correct');
  });
  onBattleWrong();
}

function onBattleWrong(){
  // Урон игроку меньше в тренировке с манекеном
  const dmg = battle.type === 'dummy' ? 6 : 12;
  state.hp -= dmg;
  updateHud();
  floatText('-' + dmg, '#ef4444', '50%', '68%');

  const sprite = $('#enemySprite');
  sprite.classList.add('attack');
  setTimeout(() => sprite.classList.remove('attack'), 200);

  if (state.hp <= 0) return playerDies();
  setTimeout(nextBattleQuestion, 900);
}

// ===== ЭТАП ПОБЕДА =====
function enemyDefeated(){
  const gold = battle.enemy.gold;
  state.gold += gold;
  state.stats.battlesWon++;
  floatText('+' + gold + '🪙', '#fbbf24', '50%', '30%');

  if (battle.type === 'dummy'){
    battle.active = false;
    state.stats.dummiesBroken++;
    if (!state.act1.completedModules.includes(battle.module.id)){
      state.act1.completedModules.push(battle.module.id);
    }
    // Левел-ап каждые 2 модуля
    const doneCount = state.act1.completedModules.filter(x => x.startsWith('a1m')).length;
    if (doneCount % 2 === 0) state.level++;
    state.hp = state.maxHp;
    updateHud();
    save();
    $('#enemyArea').classList.remove('dummy');

    showModal({
      title:'Манекен сломан! 🎯',
      text:'8 ударов — и дерево рассыпалось. Старик кивает. Урок пройден.',
      rewards: { '🪙': gold, '❤️': 'полное' },
      btn:'На карту',
      onBtn: () => { closeModal(); switchMain('map'); renderMap(); }
    });
    return;
  }

  if (battle.type === 'forest'){
    battle.active = false;
    if (!state.act1.forestCleared.includes(battle.monsterKey)){
      state.act1.forestCleared.push(battle.monsterKey);
    }
    state.stats.monstersKilled++;
    state.level++;
    state.hp = state.maxHp;
    updateHud();
    save();

    showModal({
      title:'Монстр побеждён! ⚔️',
      text:'Ты победил. Лес становится твоим.',
      rewards: { '🪙': gold, '❤️': 'полное' },
      btn:'На карту',
      onBtn: () => { closeModal(); switchMain('map'); renderMap(); }
    });
    return;
  }

  if (battle.type === 'boss'){
    battle.active = false;
    state.act1.bossDefeated = true;
    state.stats.bossesDefeated++;
    state.level += 2;
    state.hp = state.maxHp;
    updateHud();
    save();

    showModal({
      title:'🏆 Хранитель повержен!',
      text:'Дух леса склоняет голову. Старик ждёт тебя у костра.',
      rewards: { '⭐': '+2 Lv', '🪙': gold },
      btn:'Поговорить со стариком',
      onBtn: () => { closeModal(); switchMain('map'); renderMap(); }
    });
  }
}

function pickBossWord(){

  const id = battle.bossQueue[battle.bossIdx];
  battle.bossIdx++;
  return wordFor(id);
}

// Используется в финале леса, диалоге богини, страже и т.д.
function startDialogue(lines, onFinish){
  dialogue = { lines: lines, idx: 0, onFinish: onFinish };
  $('#dialogueScroll').innerHTML = '';
  switchMain('dialogue');
  $('#dialogueNextBtn').onclick = advanceDialogue;
  advanceDialogue();
}

function advanceDialogue(){
  if (!dialogue) return;
  const lines = dialogue.lines;

  if (dialogue.idx >= lines.length){
    const cb = dialogue.onFinish;
    dialogue = null;
    if (cb) cb();
    return;
  }

  const line = lines[dialogue.idx];
  const scroll = $('#dialogueScroll');
  const b = document.createElement('div');

  // Кто говорит
  let speakerName = 'Отшельник';
  let side = 'left';
  if (line.who === 'me'){ speakerName = 'Ты'; side = 'right'; }
  else if (line.who === 'goddess'){ speakerName = 'Богиня Лексия'; side = 'left'; }
  else if (line.who === 'guard'){ speakerName = 'Стражник'; side = 'left'; }
  else if (line.who === 'guard2'){ speakerName = 'Стражник'; side = 'left'; }
  else if (line.who === 'professor'){ speakerName = 'Профессор'; side = 'left'; }
  else if (line.who === 'guildmaster'){ speakerName = 'Мастер Гильдии'; side = 'left'; }
  else if (line.who === 'npc'){ speakerName = 'NPC'; side = 'left'; }
  else if (line.who === 'old'){ speakerName = 'Старик'; side = 'left'; }

  b.className = 'bubble ' + side;
  b.innerHTML = `
    <div class="speaker">${speakerName}</div>
    <div class="line">${line.en}</div>
    <div class="trans">${line.ru}</div>
  `;
  scroll.appendChild(b);
  scroll.scrollTop = scroll.scrollHeight;
  dialogue.idx++;

  // Озвучка
  speak(line.en);

  $('#dialogueNextBtn').textContent =
    dialogue.idx >= lines.length ? 'Завершить' : 'Дальше →';
}

function renderChoice(){
  const scroll = $('#choiceScroll');
  const buttons = $('#choiceButtons');
  scroll.innerHTML = '';
  buttons.innerHTML = '';

  // Реплика NPC
  const q = document.createElement('div');
  q.className = 'speech';
  q.innerHTML = `
    <div class="npc-name">🗣️ Стражник</div>
    <div class="en">${choice.question.en}</div>
    <div class="ru">${choice.question.ru}</div>
  `;
  scroll.appendChild(q);

  // Кнопки ответов
  choice.options.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'primary';
    b.style.textAlign = 'left';
    b.innerHTML = `
      <div style="font-weight:700;font-size:14px">${opt.en}</div>
      <div style="font-size:11px;opacity:.75;font-style:italic;margin-top:2px">${opt.ru}</div>
    `;
    b.onclick = () => answerChoice(opt, i);
    buttons.appendChild(b);
  });
}

function answerChoice(opt, idx){
  // Подсветка
  $$('#choiceButtons button').forEach((b, i) => {
    b.disabled = true;
    if (i === idx) b.style.background = opt.correct ? 'linear-gradient(135deg,#22c55e,#16a34a)' : 'linear-gradient(135deg,#ef4444,#dc2626)';
  });

  if (opt.correct){
    // Верно → следующая реплика
    setTimeout(() => {
      if (choice && choice.onCorrect) choice.onCorrect();
    }, 700);
  } else {
    // Неверно → урон, повтор
    state.hp -= 5;
    recordMistake(null);
    updateHud();
    floatText('-5', '#ef4444', '50%', '20%');
    if (state.hp <= 0){
      playerDies();
      return;
    }
    // Даём ещё попытку
    setTimeout(() => {
      if (choice){
        choice.options.forEach(o => o.disabled = false);
        renderChoice();
      }
    }, 1200);
  }
}

    info.className = 'speech';

      <div class="npc-name">✨ Богиня Лексия</div>

    const div = document.createElement('div');
    div.className = 'stage-card exam available';
    div.innerHTML = `
      <div class="sico">✨</div>
      <div class="info"><h3>Дар Богини</h3><p>20 слов — Первый контакт</p></div>
      <div class="sstate">💫</div>
    `;
    div.onclick = () => startGoddessGift();
    c.appendChild(div);
    return;
  }

  // Этап 2: Стражник
  if (!state.act2.guardianDone){
    const div = document.createElement('div');
    div.className = 'stage-card exam available';
    div.innerHTML = `
      <div class="sico">🛡️</div>
      <div class="info"><h3>Стражник у ворот</h3><p>Поговори с ним — он решает, пустят ли тебя</p></div>
      <div class="sstate">💬</div>
    `;
    div.onclick = () => startGuardianDialogue();
    c.appendChild(div);
    return;
  }

  // Этап 3: Восемь НПС в городе
  const title = document.createElement('div');
  title.className = 'section-title';
  title.textContent = `Дорога в Академию — ${state.act2.completedModules.filter(x => x.startsWith('a2m') && x !== 'a2m0').length} / 8`;
  c.appendChild(title);

  const npcModules = ACT2_MODULES.filter(m => m.id !== 'a2m0');  // без ворот
  npcModules.forEach((m, i) => {
    const done = state.act2.completedModules.includes(m.id);
    const unlocked = i === 0 || state.act2.completedModules.includes(npcModules[i-1].id);
    const npc = ACT2_NPCS.find(n => n.id === m.npcId);

    const div = document.createElement('div');
    div.className = 'stage-card' + (done ? ' done' : '') + (unlocked ? ' available' : ' locked');
    div.innerHTML = `
      <div class="sico">${m.icon}</div>
      <div class="info">
        <h3>${i+1}. ${m.title}</h3>
        <p>${npc ? npc.name : ''} · ${m.words.length} слов</p>
      </div>
      <div class="sstate">${done ? '✅' : (unlocked ? '▶' : '🔒')}</div>
    `;
    if (unlocked) div.onclick = () => startNpcModule(m);
    c.appendChild(div);
  });

  // Этап 4: Гражданство и переход в Академию
  const allNpcDone = npcModules.every(m => state.act2.completedModules.includes(m.id));
  if (allNpcDone && !state.act2.citizenRank){
    const div = document.createElement('div');
    div.className = 'stage-card exam available';
    div.innerHTML = `
      <div class="sico">📜</div>
      <div class="info"><h3>Гражданство города</h3><p>Ты доказал, что можешь говорить. Теперь — Академия.</p></div>
      <div class="sstate">🏆</div>
    `;
    div.onclick = () => finishAct2();
    c.appendChild(div);
  }

  if (state.act2.citizenRank){
    const road = document.createElement('div');
    road.className = 'stage-card';
    road.style.background = 'linear-gradient(135deg, rgba(251,191,36,0.15), rgba(236,72,153,0.1))';
    road.style.borderColor = 'var(--gold)';
    road.innerHTML = `
      <div class="sico">🎓</div>
      <div class="info"><h3>Дорога в Академию</h3><p>Профессор Лекс ждёт письмо от старика</p></div>
      <div class="sstate">✨</div>
    `;
    road.onclick = () => {
      showModal({
        title:'🎓 Академия',
        text:'Ты идёшь к большому зданию. Впереди — наука слова.<br><br><em>Акт III — Академия.</em>',
        btn:'Войти',
        onBtn: () => { closeModal(); startAct3(); }
      });
    };
    c.appendChild(road);
  }

// ===== ЭТАП ДИАЛОГ СО СТРАЖНИКОМ =====
function startGuardianDialogue(){
  // Идём по репликам GUARDIAN_DIALOGUE, но игрок выбирает ответы
  // Структура: реплики NPC идут по порядку, а реплики 'me' — это выбор игрока.
  runGuardianLine(0);
}

function runGuardianLine(idx){
  const lines = GUARDIAN_DIALOGUE;
  if (idx >= lines.length){
    // Диалог завершён
    state.act2.guardianDone = true;
    state.level += 1;
    state.hp = state.maxHp;
    updateHud();
    save();
    showModal({
      title:'🛡️ Стражник пропустил тебя',
      text:'«Иди в Академию. По главной дороге. Не заблудись, чужак.»',
      rewards: { '⭐': '+1 Lv' },
      btn:'На карту',
      onBtn: () => { closeModal(); switchMain('map'); renderMap(); }
    });
    return;
  }

  const line = lines[idx];

  if (line.who === 'guard'){
    // Реплика NPC — показываем в bubble, потом идём дальше
    const scroll = $('#dialogueScroll');
    scroll.innerHTML = '';
    const b = document.createElement('div');
    b.className = 'bubble left';
    b.innerHTML = `
      <div class="speaker">Стражник</div>
      <div class="line">${line.en}</div>
      <div class="trans">${line.ru}</div>
    `;
    scroll.appendChild(b);
    speak(line.en);

    setTimeout(() => runGuardianLine(idx + 1), 900);
    return;
  }

  if (line.who === 'me'){
    // Игрок должен выбрать реплику.
    // Правильная — line.en. Дистракторы — другие реплики 'me' из этого диалога.
    const meLines = lines.filter(l => l.who === 'me' && l.en !== line.en);
    const distractors = shuffle(meLines).slice(0, 2);

    // Формируем варианты: правильный + 2 дистрактора
    const options = shuffle([
      { en: line.en, ru: line.ru, correct: true },
      ...distractors.map(d => ({ en: d.en, ru: d.ru, correct: false })),
    ]);

    startChoice(
      { en: lines[idx - 1].en, ru: lines[idx - 1].ru },  // предыдущая реплика NPC
      options,
      () => runGuardianLine(idx + 1)
    );
    return;
  }
}

      currentModule = m;
      renderWordList(m);
      switchMain('words');
    }
  );
}

// Единая точка для всех модулей: смотрит на id и вызывает нужный обработчик.
function handleFinishTest(module, wrongCount){
  const uniqueWrong = new Set(test.wrong).size;

  // Проверка на провал
  if (uniqueWrong > 8){
    showModal({
      title:'Ещё разок 📖',
      text:`Ты ошибся в ${uniqueWrong} словах. Перечитай их и попробуй снова.`,
      btn:'К словарю',
      onBtn: () => { closeModal(); renderWordList(module); }
    });
    return;
  }

  const id = module.id;

  // Специальные модули
  if (id === 'goddess_gift'){
    state.act2.goddessDone = true;
    state.level += 1;
    state.hp = state.maxHp;
    updateHud(); save();
    showModal({
      title:'✨ Слова приняты',
      text:'Богиня кивает. Теперь ты можешь говорить с жителями города.',
      rewards: { '🪙': 10, '⭐': '+1 Lv' },
      btn:'На карту',
      onBtn: () => { closeModal(); switchMain('map'); renderMap(); }
    });
    return;
  }

  // Модуль Акта I — просто к манекену
  if (id.startsWith('a1m')){
    showModal({
      title:'Готов к тренировке 🎯',
      text:'Старик указывает на деревянное чучело. Пора применить слова.',
      btn:'К манекену',
      onBtn: () => { closeModal(); startDummy(module); }
    });
    return;
  }

  // Модуль Акта II — успех и +1 Lv
  if (id.startsWith('a2m')){
    if (!state.act2.completedModules.includes(id)){
      state.act2.completedModules.push(id);
    }
    state.level += 1;
    state.hp = state.maxHp;
    updateHud(); save();
    const npc = ACT2_NPCS.find(n => n.moduleId === id);
    const outroText = npc ? npc.outro.ru : 'Наставник кивает. Урок пройден.';
    const outroEn = npc ? npc.outro.en : 'Good!';
    showModal({
      title: `✅ ${module.title} пройдено`,
      text: `<em>${outroEn}</em><br><br>${outroText}`,
      rewards: { '⭐': '+1 Lv', '❤️': 'полное' },
      btn:'На карту',
      onBtn: () => { closeModal(); switchMain('map'); renderMap(); }
    });
    return;
  }

  // Модуль Акта III — успех, грамматика, +1 Lv
  if (id.startsWith('a3m')){
    if (!state.act3.completedModules.includes(id)){
      state.act3.completedModules.push(id);
    }
    state.level += 1;
    state.hp = state.maxHp;
    updateHud(); save();

    // Показываем грамматику как итог
    showModal({
      title: `✅ ${module.title} пройдено`,
      text: `<em>${module.grammar}</em><br><br>Профессор Лекс кивает. Урок усвоен.`,
      rewards: { '⭐': '+1 Lv', '❤️': 'полное' },
      btn:'На карту',
      onBtn: () => { closeModal(); switchMain('map'); renderMap(); }
    });
    return;
  }

  // Модуль Акта IV — успех
  if (id.startsWith('a4m') || id.startsWith('g33')){
    if (!state.act4.completedModules.includes(id)){
      state.act4.completedModules.push(id);
    }
    state.level += 1;
    state.hp = state.maxHp;
    updateHud(); save();
    showModal({
      title: `✅ ${module.title} пройдено`,
      text: 'Ты справился с заданием Гильдии.',
      rewards: { '⭐': '+1 Lv', '🪙': 50 },
      btn:'На карту',
      onBtn: () => { closeModal(); switchMain('map'); renderMap(); }
    });
    return;
  }

  // Fallback — просто закрыть
  showModal({
    title:'Готово',
    text:'Урок пройден.',
    btn:'На карту',
    onBtn: () => { closeModal(); switchMain('map'); renderMap(); }
  });
}

function renderAct3Map(){

  if (!state.act3.entered){
    const banner = document.createElement('div');
    banner.className = 'banner';
    banner.innerHTML = `<h2>📚 Академия Voxford</h2><p>Здесь учат не словам, а языку.</p>`;
    c.appendChild(banner);

    const info = document.createElement('div');
    info.className = 'speech';
    info.innerHTML = `
      <div class="npc-name">📜 Письмо старика</div>
      <div class="ru">У тебя есть письмо от старика к профессору Лексу. Покажи его — тебя примут.</div>
    `;
    c.appendChild(info);

    const div = document.createElement('div');
    div.className = 'stage-card exam available';
    div.innerHTML = `
      <div class="sico">📜</div>
      <div class="info"><h3>Показать письмо профессору</h3><p>Профессор Лекс ждёт</p></div>
      <div class="sstate">💬</div>
    `;
    div.onclick = () => startProfessorIntro();
    c.appendChild(div);
    return;
  }

  // Обычная карта Академии
  const banner = document.createElement('div');
  banner.className = 'banner';
  banner.innerHTML = `<h2>📚 Академия Voxford</h2><p>Профессор Лекс ведёт тебя через грамматику.</p>`;
  c.appendChild(banner);

  // Реплика профессора после последнего пройденного модуля
  const lastDone = state.act3.completedModules.filter(x => x.startsWith('a3m')).slice(-1)[0];
  if (lastDone){
    const mod = ACT3_MODULES.find(m => m.id === lastDone);
    if (mod && GRAMMAR_RULES[mod.id]){
      const d = document.createElement('div');
      d.className = 'speech';
      d.innerHTML = `
        <div class="npc-name">📚 Профессор Лекс</div>
        <div class="en">"Well done. Now — ${GRAMMAR_RULES[mod.id].name}."</div>
        <div class="ru">Хорошо. Следующая тема — ${GRAMMAR_RULES[mod.id].name}.</div>
      `;
      c.appendChild(d);
    }
  }

  const title = document.createElement('div');
  title.className = 'section-title';
  title.textContent = `Лекции — ${state.act3.completedModules.filter(x => x.startsWith('a3m')).length} / 14`;
  c.appendChild(title);

  ACT3_MODULES.forEach((m, i) => {
    const done = state.act3.completedModules.includes(m.id);
    const unlocked = i === 0 || state.act3.completedModules.includes(ACT3_MODULES[i-1].id);
    const div = document.createElement('div');
    div.className = 'stage-card' + (done ? ' done' : '') + (unlocked ? ' available' : ' locked');
    div.innerHTML = `
      <div class="sico">${m.icon}</div>
      <div class="info">
        <h3>${i+1}. ${m.title}</h3>
        <p>${m.words.length} слов · ${GRAMMAR_RULES[m.id] ? GRAMMAR_RULES[m.id].name : 'грамматика'}</p>
      </div>
      <div class="sstate">${done ? '✅' : (unlocked ? '▶' : '🔒')}</div>
    `;
    if (unlocked) div.onclick = () => startAcademyModule(m);
    c.appendChild(div);
  });

  // Выпускной экзамен
  const allDone = ACT3_MODULES.every(m => state.act3.completedModules.includes(m.id));
  if (allDone && !state.act3.graduated){
    const div = document.createElement('div');
    div.className = 'stage-card exam available';
    div.innerHTML = `
      <div class="sico">🎓</div>
      <div class="info"><h3>Выпускной экзамен Академии</h3><p>Проверка всех 280 слов и грамматики</p></div>
      <div class="sstate">🏆</div>
    `;
    div.onclick = () => startAcademyExam();
    c.appendChild(div);
  }

  if (state.act3.graduated){
    const road = document.createElement('div');
    road.className = 'stage-card';
    road.style.background = 'linear-gradient(135deg, rgba(251,191,36,0.15), rgba(236,72,153,0.1))';
    road.style.borderColor = 'var(--gold)';
    road.innerHTML = `
      <div class="sico">⚔️</div>
      <div class="info"><h3>Дорога в Гильдию</h3><p>Ты выпускник Академии. Пора стать авантюристом.</p></div>
      <div class="sstate">✨</div>
    `;
    road.onclick = () => {
      showModal({
        title:'⚔️ Гильдия авантюристов',
        text:'Впереди — большие здания гильдии. Ты готов.<br><br><em>Акт IV — Гильдия.</em>',
        btn:'Войти в Гильдию',
        onBtn: () => { closeModal(); startAct4(); }
      });
    };
    c.appendChild(road);
  }
}

// ===== ЭТАП МОДУЛЬ АКАДЕМИИ =====
function startAcademyModule(m){
  // Показываем вступительную грамматическую карточку, потом словарь
  const rule = GRAMMAR_RULES[m.id];
  const examples = GRAMMAR_EXAMPLES[m.id] || [];

  // Строим экран со словарём, но с добавленным блоком грамматики сверху
  currentModule = m;
  renderAcademyWordList(m, rule, examples);
  switchMain('words');
}

function renderAcademyWordList(m, rule, examples){
  const c = $('#wordsScroll');
  c.innerHTML = '';

  // Баннер
  const banner = document.createElement('div');
  banner.className = 'banner';
  banner.innerHTML = `<h2>${m.icon} ${m.title}</h2><p>Профессор Лекс: «${rule.desc}»</p>`;
  c.appendChild(banner);

  // Грамматическая карточка
  const gc = document.createElement('div');
  gc.className = 'speech';
  gc.style.background = 'linear-gradient(135deg, rgba(139,92,246,0.15), rgba(236,72,153,0.08))';
  gc.innerHTML = `
    <div class="npc-name">📐 Грамматика — ${rule.name}</div>
    <div class="ru">${rule.desc}</div>
    ${examples.length ? `
      <div style="margin-top:10px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px">Примеры</div>
      ${examples.map(e => `
        <div style="margin-top:6px;font-size:13px">
          <span style="color:#22c55e">✓</span> <b>${e.correct}</b>
        </div>
      `).join('')}
    ` : ''}
  `;
  c.appendChild(gc);

  // Словарь
  const t = document.createElement('div');
  t.className = 'section-title';
  t.textContent = `📖 Словарь — ${m.words.length} слов`;
  c.appendChild(t);

  m.words.forEach((id, i) => {
    const w = wordFor(id);
    const row = document.createElement('div');
    row.className = 'word-row';
    row.innerHTML = `
      <div class="idx">${i+1}</div>
      <div class="en">${w.en} <span class="tr">[${w.tr}]</span> <span class="pos">${posRu(w.pos)}</span></div>
      <div class="ru">${w.ru}</div>
      <button class="spk">🔊</button>
    `;
    row.querySelector('.spk').onclick = (e) => { e.stopPropagation(); speak(w.en); };
    c.appendChild(row);
  });

  $('#wordsDoneBtn').onclick = () => startTest(m);
}

// ===== ЭТАП ГРАММАТИЧЕСКИЙ МИНИ-ТЕСТ =====
// После основного теста слов — короткий тест на грамматику (2 вопроса)
// Покажем прямо в модалке после успешного теста.
// (Реализация: модифицируем handleFinishTest для a3m — уже сделано выше,
// но добавим грамматический вопрос ПЕРЕД финальным экраном)

// Для простоты: после теста слов — один вопрос по грамматике модуля.
// Если ошибка — урон, но модуль всё равно засчитывается.
function askGrammarQuestion(module, onDone){
  const examples = GRAMMAR_EXAMPLES[module.id];
  if (!examples || examples.length === 0){ onDone(); return; }

  const ex = examples[randInt(0, examples.length - 1)];
  const options = shuffle([
    { text: ex.correct, correct: true },
    { text: ex.wrong,   correct: false },
  ]);

  const scroll = $('#choiceScroll');
  const buttons = $('#choiceButtons');
  scroll.innerHTML = '';
  buttons.innerHTML = '';

  const q = document.createElement('div');
  q.className = 'speech';
  q.innerHTML = `
    <div class="npc-name">📐 Проверка грамматики</div>
    <div class="en">Which is correct?</div>
    <div class="ru">Какой вариант правильный?</div>
  `;
  scroll.appendChild(q);

  options.forEach((opt) => {
    const b = document.createElement('button');
    b.className = 'primary';
    b.style.textAlign = 'left';
    b.textContent = opt.text;
    b.onclick = () => {
      $$('#choiceButtons button').forEach(x => x.disabled = true);
      if (opt.correct){
        b.style.background = 'linear-gradient(135deg,#22c55e,#16a34a)';
        setTimeout(onDone, 700);
      } else {
        b.style.background = 'linear-gradient(135deg,#ef4444,#dc2626)';
        state.hp -= 5;
        updateHud();
        floatText('-5', '#ef4444', '50%', '20%');
        if (state.hp <= 0) playerDies();
        else setTimeout(onDone, 1200);
      }
    };
    buttons.appendChild(b);
  });

  switchMain('choice');
}
// ===== ЭТАП ГРАММАТИЧЕСКИЙ МИНИ-ТЕСТ ЗАВЕРШЕН =====

// ===== ЭТАП ВЫПУСКНОЙ ЭКЗАМЕН АКАДЕМИИ =====
function startAcademyExam(){
  // Берём все слова акта III и делаем выборку 100 вопросов
  const allIds = ACT3_MODULES.flatMap(m => m.words);
  const sampleSize = Math.min(100, allIds.length);
  const sample = shuffle(allIds).slice(0, sampleSize);

  battle = {
    type: 'academy_exam',
    bossPool: allIds,
    bossQueue: sample.slice(),
    bossIdx: 0,
    module: { words: allIds, id: 'academy_exam' },
    enemy: { name:'Выпускной экзамен', icon:'🎓', hp: 1300, gold: 300 },
    enemyHp: 1300,
    enemyMaxHp: 1300,
    active: true,
    timer: null,
    currentWord: null,
    playerHp: state.hp,
    correctCount: 0,
    totalQuestions: sampleSize,
  };

  $('#enemyArea').classList.remove('dummy', 'peaceful');
  $('#enemySprite').textContent = '🎓';
  $('#enemyName').textContent = 'Выпускной экзамен';
  $('#battleLabel').textContent = 'Экзамен';
  $('#timerWrap').style.display = 'block';
  updateEnemyHp();
  switchMain('battle');

  showModal({
    title:'🎓 Выпускной экзамен',
    text:`Профессор Лекс задаёт ${sampleSize} вопросов. Каждый ответ — удар по тьме незнания.`,
    btn:'Начать экзамен',
    onBtn: () => { closeModal(); setTimeout(nextBattleQuestion, 400); }
  });
}

// Обработка завершения академического экзамена
const _origEnemyDefeated = enemyDefeated;
enemyDefeated = function(){
  if (battle && battle.type === 'academy_exam'){
    battle.active = false;
    state.act3.graduated = true;
    state.level += 3;
    state.hp = state.maxHp;
    updateHud(); save();
    $('#enemyArea').classList.remove('dummy', 'peaceful');

    showModal({
      title:'🎓 Ты выпускник Академии!',
      text:'Профессор Лекс вручает тебе диплом.<br><br>«Ты знаешь 280 слов и всю базовую грамматику. Пора в Гильдию.»',
      rewards: { '⭐': '+3 Lv', '🪙': 300 },
      btn:'К Гильдии',
      onBtn: () => { closeModal(); switchMain('map'); renderMap(); }
    });
    return;
  }
  _origEnemyDefeated();
};

function renderAct4Map(){
  const c = $('#mapScroll');
  c.innerHTML = '';

  // Если ещё не вступил — показать вход
  if (!state.act4.joined){
    const banner = document.createElement('div');
    banner.className = 'banner';
    banner.innerHTML = `<h2>⚔️ Гильдия авантюристов</h2><p>Только сильные становятся легендами.</p>`;
    c.appendChild(banner);

    const info = document.createElement('div');
    info.className = 'speech';
    info.innerHTML = `
      <div class="npc-name">🗣️ Голос за дверью</div>
      <div class="en">"Who goes there? State your name!"</div>
      <div class="ru">Кто там? Назови себя!</div>
    `;
    c.appendChild(info);

    const div = document.createElement('div');
    div.className = 'stage-card exam available';
    div.innerHTML = `
      <div class="sico">⚔️</div>
      <div class="info"><h3>Войти в Гильдию</h3><p>Мастер Варан принимает новичков</p></div>
      <div class="sstate">💬</div>
    `;
    div.onclick = () => startGuildMasterIntro();
    c.appendChild(div);
    return;
  }

  // Обычная карта Гильдии
  const banner = document.createElement('div');
  banner.className = 'banner';
  banner.innerHTML = `<h2>⚔️ Гильдия авантюристов</h2><p>Ранг: <b style="color:${state.rank ? RANKS.find(r=>r.id===state.rank).color : 'var(--muted)'}">${state.rank || '—'}</b></p>`;
  c.appendChild(banner);

  // Реплика мастера после последнего пройденного модуля
  const lastDone = state.act4.completedModules.filter(x => x.startsWith('a4m') || x.startsWith('g33')).slice(-1)[0];
  if (lastDone){
    const d = document.createElement('div');
    d.className = 'speech';
    d.innerHTML = `
      <div class="npc-name">⚔️ Мастер Варан</div>
      <div class="en">"Good work, adventurer. Next task awaits."</div>
      <div class="ru">Хорошая работа, авантюрист. Следующее задание ждёт.</div>
    `;
    c.appendChild(d);
  }

  const title = document.createElement('div');
  title.className = 'section-title';
  title.textContent = `Задания Гильдии — ${state.act4.completedModules.length} / 6`;
  c.appendChild(title);

  ACT4_MODULES.forEach((m, i) => {
    const done = state.act4.completedModules.includes(m.id);
    const unlocked = i === 0 || state.act4.completedModules.includes(ACT4_MODULES[i-1].id);
    const div = document.createElement('div');
    div.className = 'stage-card' + (done ? ' done' : '') + (unlocked ? ' available' : ' locked');
    div.innerHTML = `
      <div class="sico">${m.icon}</div>
      <div class="info">
        <h3>${i+1}. ${m.title}</h3>
        <p>${m.words.length} слов</p>
      </div>
      <div class="sstate">${done ? '✅' : (unlocked ? '▶' : '🔒')}</div>
    `;
    if (unlocked) div.onclick = () => startGuildModule(m);
    c.appendChild(div);
  });

  // Экзамен на ранг
  const allDone = ACT4_MODULES.every(m => state.act4.completedModules.includes(m.id));
  if (allDone && state.rank === 'E'){
    const div = document.createElement('div');
    div.className = 'stage-card exam available';
    div.innerHTML = `
      <div class="sico">🎯</div>
      <div class="info"><h3>Экзамен на ранг D</h3><p>Проверка всех пройденных слов</p></div>
      <div class="sstate">🏆</div>
    `;
    div.onclick = () => startRankExam('simple');
    c.appendChild(div);
  }

  // Фразы-заклинания — доступны после вступления
  const spellTitle = document.createElement('div');
  spellTitle.className = 'section-title';
  spellTitle.textContent = 'Фразы-заклинания';
  c.appendChild(spellTitle);

  const spellBtn = document.createElement('div');
  spellBtn.className = 'stage-card available';
  spellBtn.innerHTML = `
    <div class="sico">✨</div>
    <div class="info"><h3>Тренировка заклинаний</h3><p>Собирай фразы из выученных слов</p></div>
    <div class="sstate">📖</div>
  `;
  spellBtn.onclick = () => openSpellBook();
  c.appendChild(spellBtn);

  // Экзамены рангов (после D)
  if (state.rank && state.rank !== 'E' && state.rank !== 'SSS'){
    const nextIdx = RANKS.findIndex(r => r.id === state.rank) + 1;
    if (nextIdx < RANKS.length){
      const next = RANKS[nextIdx];
      const canTake = state.learned.length >= next.reqWords;
      const nextExam = RANK_EXAMS[next.reqExam];

      const rankTitle = document.createElement('div');
      rankTitle.className = 'section-title';
      rankTitle.textContent = 'Следующий ранг';
      c.appendChild(rankTitle);

      const div = document.createElement('div');
      div.className = 'stage-card exam' + (canTake ? ' available' : ' locked');
      div.innerHTML = `
        <div class="sico">🎖️</div>
        <div class="info">
          <h3>Экзамен на ранг ${next.id}</h3>
          <p>${canTake ? nextExam.title : `Нужно ${next.reqWords} слов (у тебя ${state.learned.length})`}</p>
        </div>
        <div class="sstate">${canTake ? '🏆' : '🔒'}</div>
      `;
      if (canTake) div.onclick = () => startRankExam(next.reqExam);
      c.appendChild(div);
    }
  }

  // Финальный ранг SSS — финал игры
  if (state.rank === 'SSS'){
    const finalTitle = document.createElement('div');
    finalTitle.className = 'section-title';
    finalTitle.textContent = 'Финал';
    c.appendChild(finalTitle);

    const div = document.createElement('div');
    div.className = 'stage-card exam available';
    div.style.background = 'linear-gradient(135deg, rgba(251,191,36,0.25), rgba(236,72,153,0.15))';
    div.innerHTML = `
      <div class="sico">👑</div>
      <div class="info"><h3>Построить свой город</h3><p>Ты достиг ранга SSS. Начни новую жизнь.</p></div>
      <div class="sstate">🌟</div>
    `;
    div.onclick = () => startEndgame();
    c.appendChild(div);
  }
}

function openSpellBook(){
  const c = $('#mapScroll');
  c.innerHTML = '';

  const banner = document.createElement('div');
  banner.className = 'banner';
  banner.innerHTML = `<h2>✨ Книга заклинаний</h2><p>Собери фразу из выученных слов — сотвори магию.</p>`;
  c.appendChild(banner);

  const info = document.createElement('div');
  info.className = 'speech';
  info.innerHTML = `
    <div class="npc-name">📖 Как это работает</div>
    <div class="ru">Каждое заклинание — фраза из слов, которые ты уже знаешь. Собери правильно — увидишь эффект.</div>
  `;
  c.appendChild(info);

  // Показываем только те заклинания, где все слова выучены и ранг позволяет
  const rankOrder = ['E','D','C','B','A','S','SS','SSS'];
  const currentRankIdx = state.rank ? rankOrder.indexOf(state.rank) : -1;

  const available = SPELL_PHRASES.filter(sp => {
    const spellRankIdx = rankOrder.indexOf(sp.minRank);
    if (spellRankIdx > currentRankIdx) return false;
    return sp.words.every(id => state.learned.includes(id));
  });

  const locked = SPELL_PHRASES.filter(sp => {
    const spellRankIdx = rankOrder.indexOf(sp.minRank);
    if (spellRankIdx > currentRankIdx) return true;
    return !sp.words.every(id => state.learned.includes(id));
  });

  if (available.length === 0 && locked.length === 0){
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = 'Заклинаний пока нет. Учи слова!';
    c.appendChild(e);
  }

  const t = document.createElement('div');
  t.className = 'section-title';
  t.textContent = `Доступно — ${available.length}`;
  c.appendChild(t);

  available.forEach(sp => {
    const div = document.createElement('div');
    div.className = 'stage-card available';
    div.innerHTML = `
      <div class="sico">✨</div>
      <div class="info">
        <h3>${sp.name}</h3>
        <p>${sp.hint} · ${sp.dmg > 0 ? 'Урон ' + sp.dmg : (sp.dmg < 0 ? 'Хил ' + (-sp.dmg) : 'Защита')}</p>
      </div>
      <div class="sstate">▶</div>
    `;
    div.onclick = () => startSpellCasting(sp);
    c.appendChild(div);
  });

  if (locked.length > 0){
    const t2 = document.createElement('div');
    t2.className = 'section-title';
    t2.textContent = `Заблокировано — ${locked.length}`;
    c.appendChild(t2);

    locked.slice(0, 8).forEach(sp => {
      const div = document.createElement('div');
      div.className = 'stage-card locked';
      div.innerHTML = `
        <div class="sico">🔒</div>
        <div class="info">
          <h3>${sp.name}</h3>
          <p>Нужен ранг ${sp.minRank} и слова: ${sp.words.filter(id => !state.learned.includes(id)).length ? 'не выучены' : 'готово'}</p>
        </div>
        <div class="sstate">🔒</div>
      `;
      c.appendChild(div);
    });
  }

  // Кнопка назад
  const back = document.createElement('button');
  back.className = 'ghost';
  back.style.width = '100%';
  back.style.marginTop = '20px';
  back.textContent = '← Назад к Гильдии';
  back.onclick = () => renderAct4Map();
  c.appendChild(back);
}

// ===== ЭТАП СБОРКА ФРАЗЫ =====
let phraseState = null;

function startSpellCasting(spell){
  // Слова для сборки + 2 дистрактора
  const correctWords = spell.words.map(id => wordFor(id).en);
  const allKnownWords = state.learned.map(id => wordFor(id).en).filter(w => !correctWords.includes(w));
  const distractors = shuffle(allKnownWords).slice(0, 2);

  phraseState = {
    spell: spell,
    correct: correctWords,
    built: [],
    pool: shuffle([...correctWords, ...distractors]),
    distractors: distractors,
  };

  // Настраиваем экран фразы
  $('#phraseName').textContent = spell.name;
  $('#phraseHint').textContent = spell.hint + (spell.dmg !== 0 ? ` — эффект: ${spell.dmg > 0 ? 'урон ' + spell.dmg : 'хил ' + (-spell.dmg)}` : '');

  $('#phraseEnemySprite').textContent = '👹';
  $('#phraseEnemyName').textContent = 'Тренировочный враг';
  $('#phraseEnemyHp').style.width = '100%';
  $('#phraseEnemyArea').classList.remove('dummy', 'peaceful');

  renderPhrase();
  switchMain('phrase');
}

function renderPhrase(){
  const target = $('#phraseTarget');
  const pool = $('#phraseWordPool');
  target.innerHTML = '';
  pool.innerHTML = '';

  if (phraseState.built.length === 0){
    target.innerHTML = '<span class="hint">Нажимай слова ниже, чтобы собрать фразу...</span>';
  } else {
    phraseState.built.forEach((w, i) => {
      const chip = document.createElement('div');
      chip.className = 'word-chip in-target';
      chip.textContent = w;
      chip.onclick = () => {
        phraseState.built.splice(i, 1);
        renderPhrase();
      };
      target.appendChild(chip);
    });
  }

  // Пул: слова, которые ещё не использованы в собранном
  const used = {};
  phraseState.built.forEach(w => used[w] = (used[w] || 0) + 1);

  const availablePool = [];
  const poolCount = {};
  phraseState.pool.forEach(w => poolCount[w] = (poolCount[w] || 0) + 1);
  for (const w in poolCount){
    const remaining = poolCount[w] - (used[w] || 0);
    for (let i = 0; i < remaining; i++) availablePool.push(w);
  }

  shuffle(availablePool).forEach(w => {
    const chip = document.createElement('div');
    chip.className = 'word-chip';
    chip.textContent = w;
    chip.onclick = () => {
      phraseState.built.push(w);
      renderPhrase();
    };
    pool.appendChild(chip);
  });

  // Валидация
  if (phraseState.built.length === phraseState.correct.length){
    const isCorrect = phraseState.built.every((w, i) => w === phraseState.correct[i]);
    target.classList.toggle('valid', isCorrect);
    target.classList.toggle('invalid', !isCorrect);
  } else {
    target.classList.remove('valid', 'invalid');
  }
}

$('#phraseClear').onclick = () => {
  if (!phraseState) return;
  phraseState.built = [];
  renderPhrase();
};

$('#phraseCast').onclick = () => {
  if (!phraseState) return;
  const built = phraseState.built;
  const correct = phraseState.correct;
  const isCorrect = built.length === correct.length && built.every((w, i) => w === correct[i]);

  if (isCorrect){
    // Успех
    const sp = phraseState.spell;
    if (sp.dmg > 0){
      // Урон
      const targetBar = $('#phraseEnemyHp');
      targetBar.style.width = '0%';
      floatText('-' + sp.dmg, '#fbbf24', '50%', '20%');
      const sprite = $('#phraseEnemySprite');
      sprite.classList.add('hit');
      setTimeout(() => sprite.classList.remove('hit'), 200);
    } else if (sp.dmg < 0){
      // Хил
      const heal = Math.min(-sp.dmg, state.maxHp - state.hp);
      state.hp += heal;
      updateHud();
      floatText('+' + heal, '#22c55e', '50%', '20%');
    } else {
      floatText('Щит!', '#3b82f6', '50%', '20%');
    }

    // Слэш-эффект
    const slash = $('#phraseSlash');
    slash.classList.remove('fire');
    void slash.offsetWidth;
    slash.classList.add('fire');

    setTimeout(() => {
      showModal({
        title:'✨ Заклинание сработало!',
        text:`<em>${sp.name}</em> — ты произнёс фразу правильно.`,
        rewards: { '✨': sp.name },
        btn:'Готово',
        onBtn: () => { closeModal(); openSpellBook(); }
      });
    }, 600);

  } else {
    // Неудача
    phraseState.built = [];
    renderPhrase();
    floatText('Ошибка!', '#ef4444', '50%', '20%');

    // Небольшой урон
    state.hp -= 5;
    updateHud();
    if (state.hp <= 0) playerDies();
  }
};

// ===== ЭТАП ЭКЗАМЕН НА РАНГ =====
function startRankExam(examId){
  const exam = RANK_EXAMS[examId];
  if (!exam) return;

  // Берём все выученные слова
  const allIds = state.learned.slice();
  if (allIds.length < exam.words){
    showModal({
      title:'🎯 Ещё не готов',
      text:`Для экзамена нужно ${exam.words} слов. У тебя пока ${allIds.length}.`,
      btn:'Понятно',
      onBtn: closeModal
    });
    return;
  }

  const sampleSize = Math.min(exam.words, allIds.length);
  const sample = shuffle(allIds).slice(0, sampleSize);

  // HP босса = 20 × количество слов в экзамене / 10
  const bossHp = Math.floor(sampleSize * 2) + 100;

  battle = {
    type: 'rank_exam',
    examId: examId,
    bossPool: allIds,
    bossQueue: sample.slice(),
    bossIdx: 0,
    module: { words: allIds, id: 'rank_exam_' + examId },
    enemy: {
      name: exam.title,
      icon: '🎖️',
      hp: bossHp,
      gold: 0,
    },
    enemyHp: bossHp,
    enemyMaxHp: bossHp,
    active: true,
    timer: null,
    currentWord: null,
    playerHp: state.hp,
    timeLimit: exam.timeLimit,
    correctCount: 0,
    totalQuestions: sampleSize,
    mistakesCount: 0,
  };

  $('#enemyArea').classList.remove('dummy', 'peaceful');
  $('#enemySprite').textContent = '🎖️';
  $('#enemyName').textContent = exam.title;
  $('#battleLabel').textContent = 'Экзамен';
  $('#timerWrap').style.display = 'block';
  updateEnemyHp();
  switchMain('battle');

  showModal({
    title: `🎖️ ${exam.title}`,
    text: `Вопросов: ${sampleSize}. Таймер: ${exam.timeLimit} сек. Провал — если ошибок больше 30%.`,
    btn:'Начать',
    onBtn: () => { closeModal(); setTimeout(nextBattleQuestion, 400); }
  });
}

// Обработка завершения экзамена на ранг
const _origEnemyDefeatedRank = enemyDefeated;
enemyDefeated = function(){
  if (battle && battle.type === 'rank_exam'){
    battle.active = false;

    // Проверяем количество ошибок
    const mistakeRate = battle.mistakesCount / battle.totalQuestions;
    if (mistakeRate > 0.3){
      // Провал
      state.stats.examsFailed++;
      state.hp = Math.floor(state.maxHp * 0.5);
      updateHud(); save();
      $('#enemyArea').classList.remove('dummy', 'peaceful');

      showModal({
        title:'❌ Экзамен не сдан',
        text:`Ошибок: ${battle.mistakesCount} из ${battle.totalQuestions}. Нужно больше практики.`,
        btn:'Вернуться на карту',
        onBtn: () => { closeModal(); switchMain('map'); renderMap(); }
      });
      return;
    }

    // Успех!
    state.stats.examsPassed++;
    if (!state.passedExams.includes(battle.examId)){
      state.passedExams.push(battle.examId);
    }
    // Находим ранг по экзамену
    const rank = RANKS.find(r => r.reqExam === battle.examId);
    if (rank){
      state.rank = rank.id;
    }
    state.level += 2;
    state.hp = state.maxHp;
    updateHud(); save();
    $('#enemyArea').classList.remove('dummy', 'peaceful');

    showModal({
      title:`🎖️ Ранг ${state.rank}!`,
      text:`Ты сдал экзамен. Мастер Варан вручает тебе значок ранга <b style="color:${rank ? rank.color : '#fff'}">${state.rank}</b>.<br><br><em>${rank ? rank.desc : ''}</em>`,
      rewards: { '⭐': '+2 Lv', '🎖️': state.rank },
      btn:'На карту',
      onBtn: () => { closeModal(); switchMain('map'); renderMap(); }
    });
    return;
  }
  _origEnemyDefeatedRank();
};

// Модифицируем answerBattle для экзамена — считаем ошибки
const _origAnswerBattle = answerBattle;
answerBattle = function(btn, isCorrect){
  if (battle && battle.type === 'rank_exam' && !isCorrect){
    battle.mistakesCount = (battle.mistakesCount || 0) + 1;
  }
  _origAnswerBattle(btn, isCorrect);
};

// Модифицируем onBattleWrong для экзамена — не вычитаем HP игроку (это экзамен)
const _origOnBattleWrong = onBattleWrong;
onBattleWrong = function(){
  if (battle && battle.type === 'rank_exam'){
    // На экзамене — не урон, а пометка ошибки
    if (battle.enemyHp > 0){
      // Не отнимаем HP у игрока — просто идём дальше
    }
    floatText('✗', '#ef4444', '50%', '68%');
    if (battle.enemyHp <= 0) return enemyDefeated();
    setTimeout(nextBattleQuestion, 900);
    return;
  }
  _origOnBattleWrong();
};

// Таймер для экзамена использует battle.timeLimit
const _origNextBattleQuestion = nextBattleQuestion;
nextBattleQuestion = function(){
  if (battle && battle.type === 'rank_exam'){
    if (!battle.active) return;
    const w = pickBossWord();
    battle.currentWord = w;
    setWordSmooth($('#battleWord'), w.en);

    const correct = w.ru;
    const allIds = battle.bossPool;
    const allRu = allIds.map(id => wordFor(id).ru).filter(r => r !== correct);
    const wrongs = shuffle(allRu).slice(0, 3);
    const opts = shuffle([correct, ...wrongs]);

    const box = $('#battleAnswers');
    box.innerHTML = '';
    opts.forEach(o => {
      const b = document.createElement('button');
      b.textContent = o;
      b.onclick = () => answerBattle(b, o === correct);
      box.appendChild(b);
    });

    startTimer(battle.timeLimit || 4, onBattleTimeout);
    return;
  }
  _origNextBattleQuestion();
};

function makeTranslateQuestion(){
  // Берём случайное выученное слово
  const pool = state.learned.slice();
  if (pool.length === 0) return null;
  const id = pool[randInt(0, pool.length - 1)];

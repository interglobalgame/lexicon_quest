  // Дистракторы — другие английские слова из выученных
  const otherIds = pool.filter(x => x !== id);
  const wrongs = shuffle(otherIds).slice(0, 3).map(x => wordFor(x).en);

  const opts = shuffle([w.en, ...wrongs]);
  return {
    question: w.ru,
    correct: w.en,
    options: opts,
    wordId: id,
  };
}
// ===== ЭТАП ВОПРОСЫ ПЕРЕВОДА ДЛЯ ЭКЗАМЕНОВ ЗАВЕРШЕН =====

// ===== ЭТАП ГЕНЕРАТОР ВОПРОСОВ ЭКЗАМЕНА =====
// Возвращает вопрос нужного типа
function generateExamQuestion(type, examId){
  if (type === 'words'){
    // Обычный перевод en → ru
    const pool = state.learned.slice();
    if (pool.length === 0) return null;
    const id = pool[randInt(0, pool.length - 1)];
    const w = wordFor(id);

    const otherIds = pool.filter(x => x !== id);
    const wrongs = shuffle(otherIds).slice(0, 3).map(x => wordFor(x).ru);
    const opts = shuffle([w.ru, ...wrongs]);

    return {
      kind: 'choice',
      word: w.en,
      question: null,
      correct: w.ru,
      options: opts,
      wordId: id,
      label: 'Переведи слово',
    };
  }

  if (type === 'grammar'){
    const q = GRAMMAR_QUESTIONS[randInt(0, GRAMMAR_QUESTIONS.length - 1)];
    const opts = shuffle([q.correct, q.wrong]);
    return {
      kind: 'choice',
      word: null,
      question: q.q,
      correct: q.correct,
      options: opts,
      label: 'Грамматика',
    };
  }

  if (type === 'translate'){
    const t = makeTranslateQuestion();
    if (!t) return null;
    return {
      kind: 'choice',
      word: null,
      question: t.question,
      correct: t.correct,
      options: t.options,
      wordId: t.wordId,
      label: 'Переведи на английский',
    };
  }

  if (type === 'phrases'){
    // Собираем фразу из слов (упрощённо: показать целевую фразу)
    // Для экзамена используем формат multiple choice: правильный порядок vs перемешанный
    const spell = SPELL_PHRASES[randInt(0, SPELL_PHRASES.length - 1)];
    const correctPhrase = spell.words.map(id => wordFor(id).en).join(' ');
    const shuffled = shuffle(spell.words).map(id => wordFor(id).en).join(' ');
    const opts = shuffle([correctPhrase, shuffled]).slice(0, 2);

    return {
      kind: 'choice',
      word: null,
      question: `Собери фразу "${spell.name}":`,
      correct: correctPhrase,
      options: opts,
      label: 'Собери фразу',
    };
  }

  if (type === 'compose'){
    // Свободная композиция — выбор правильного перевода предложения
    const sentences = [
      { correct:'I have been learning English for three years.', wrong:'I learning English for three years.' },
      { correct:'She had already left when we arrived.',         wrong:'She already left when we arrive.' },
      { correct:'If I had known, I would have helped you.',      wrong:'If I knew, I would help you.' },
      { correct:'Neither the teacher nor the student was ready.',wrong:'Neither the teacher or the student was ready.' },
      { correct:'I would rather walk than take the bus.',        wrong:'I would rather to walk than take the bus.' },
    ];
    const s = sentences[randInt(0, sentences.length - 1)];
    const opts = shuffle([s.correct, s.wrong]);
    return {
      kind: 'choice',
      word: null,
      question: 'Выбери правильное предложение:',
      correct: s.correct,
      options: opts,
      label: 'Композиция',
    };
  }

  return null;
}
// ===== ЭТАП ГЕНЕРАТОР ВОПРОСОВ ЭКЗАМЕНА ЗАВЕРШЕН =====

// ===== ЭТАП ЗАПУСК РАСШИРЕННОГО ЭКЗАМЕНА =====
// Переопределяем startRankExam
startRankExam = function(examId){
  const exam = RANK_EXAMS_FULL[examId];
  if (!exam) return;

  // Проверка: достаточно ли слов
  if (state.learned.length < exam.words){
    showModal({
      title:'🎯 Ещё не готов',
      text:`Для экзамена нужно ${exam.words} слов. У тебя пока ${state.learned.length}.`,
      btn:'Понятно',
      onBtn: closeModal
    });
    return;
  }

  // Количество вопросов = exam.words, но ограничим разумным максимумом (30)
  const totalQuestions = Math.min(exam.words, 30);
  const timeLimit = exam.timeLimit;

  battle = {
    type: 'rank_exam',
    examId: examId,
    exam: exam,
    bossPool: state.learned.slice(),
    bossQueue: [],  // будем генерировать на лету
    bossIdx: 0,
    module: { words: state.learned.slice(), id: 'rank_exam_' + examId },
    enemy: {
      name: exam.title,
      icon: '🎖️',
      hp: totalQuestions,
      gold: 0,
    },
    enemyHp: totalQuestions,     // HP = количество вопросов (каждый правильный = 1 урон)
    enemyMaxHp: totalQuestions,
    active: true,
    timer: null,
    currentWord: null,
    playerHp: state.hp,
    timeLimit: timeLimit,
    correctCount: 0,
    mistakesCount: 0,
    totalQuestions: totalQuestions,
    currentQuestion: null,
    sectionIndex: 0,
    questionInSection: 0,
    questionsPerSection: Math.floor(totalQuestions / exam.sections.length),
  };

  $('#enemyArea').classList.remove('dummy', 'peaceful');
  $('#enemySprite').textContent = '🎖️';
  $('#enemyName').textContent = exam.title;
  $('#battleLabel').textContent = 'Экзамен';
  $('#timerWrap').style.display = 'block';
  updateEnemyHp();
  switchMain('battle');

  showModal({
    title: `🎖️ ${exam.title}`,
    text: `Вопросов: ${totalQuestions}. Таймер: ${timeLimit} сек.<br>Разделы: ${exam.sections.join(' → ')}<br>Нужно правильных: ${Math.round(totalQuestions * exam.passRate)}+`,
    btn:'Начать',
    onBtn: () => { closeModal(); setTimeout(nextExamQuestion, 400); }
  });
};
// ===== ЭТАП ЗАПУСК РАСШИРЕННОГО ЭКЗАМЕНА ЗАВЕРШЕН =====

// ===== ЭТАП ЛОГИКА ЭКЗАМЕНА =====
function nextExamQuestion(){
  if (!battle || !battle.active || battle.type !== 'rank_exam') return;

  // Проверяем, не закончились ли вопросы
  const askedCount = battle.correctCount + battle.mistakesCount;
  if (askedCount >= battle.totalQuestions){
    return finishRankExam();
  }

  // Определяем текущую секцию
  const exam = battle.exam;
  const sectionIdx = Math.min(
    Math.floor(askedCount / battle.questionsPerSection),
    exam.sections.length - 1
  );
  const sectionType = exam.sections[sectionIdx];

  // Генерируем вопрос
  const question = generateExamQuestion(sectionType, battle.examId);
  if (!question){
    // Если не удалось сгенерировать — идём дальше
    return finishRankExam();
  }

  battle.currentQuestion = question;
  battle.currentWord = question.wordId ? wordFor(question.wordId) : null;

  // Отображаем
  const labelEl = $('#battleLabel');
  const wordEl = $('#battleWord');
  labelEl.textContent = question.label + ` (${askedCount + 1}/${battle.totalQuestions})`;

  if (question.word){
    setWordSmooth(wordEl, question.word);
  } else if (question.question){
    setWordSmooth(wordEl, question.question);
    wordEl.style.fontSize = '18px';
  } else {
    setWordSmooth(wordEl, '?');
  }

  // Кнопки
  const box = $('#battleAnswers');
  box.innerHTML = '';
  question.options.forEach(opt => {
    const b = document.createElement('button');
    b.textContent = opt;
    if (!question.word) {
      // Длинные варианты — уменьшаем шрифт
      b.style.fontSize = '13px';
      b.style.padding = '12px 6px';
    }
    b.onclick = () => answerExamQuestion(b, opt === question.correct);
    box.appendChild(b);
  });

  // Сброс шрифта слова
  wordEl.style.fontSize = question.word ? '34px' : '18px';

  // Таймер
  startTimer(battle.timeLimit, onExamTimeout);
}

function answerExamQuestion(btn, isCorrect){
  clearInterval(battle.timer);
  if (!battle || !battle.active) return;
  $$('#battleAnswers button').forEach(b => b.disabled = true);

  if (isCorrect){
    btn.classList.add('correct');
    battle.correctCount++;
    // Урон боссу = 1 (HP = количество вопросов)
    battle.enemyHp = battle.totalQuestions - battle.correctCount;
    updateEnemyHp();
    updateHud();
    save();

    // Небольшой визуальный эффект
    const sprite = $('#enemySprite');
    sprite.classList.add('hit');
    setTimeout(() => sprite.classList.remove('hit'), 150);

    if (battle.enemyHp <= 0) return finishRankExam();
    setTimeout(nextExamQuestion, 400);
  } else {
    btn.classList.add('wrong');
    battle.mistakesCount++;
    recordMistake(battle.currentWord ? battle.currentWord.id : null);

    // Показываем правильный ответ
    $$('#battleAnswers button').forEach(b => {
      if (b.textContent === battle.currentQuestion.correct) b.classList.add('correct');
    });

    setTimeout(nextExamQuestion, 900);
  }
}

function onExamTimeout(){
  if (!battle || !battle.active) return;
  $$('#battleAnswers button').forEach(b => {
    b.disabled = true;
    if (b.textContent === battle.currentQuestion.correct) b.classList.add('correct');
  });
  battle.mistakesCount++;
  recordMistake(battle.currentWord ? battle.currentWord.id : null);
  setTimeout(nextExamQuestion, 900);
}

function finishRankExam(){
  battle.active = false;
  clearInterval(battle.timer);

  const correct = battle.correctCount;
  const total = battle.totalQuestions;
  const rate = correct / total;
  const passRate = battle.exam.passRate;

  if (rate < passRate){
    // Провал
    state.stats.examsFailed++;
    state.hp = Math.floor(state.maxHp * 0.5);
    updateHud(); save();
    $('#enemyArea').classList.remove('dummy', 'peaceful');

    showModal({
      title:'❌ Экзамен не сдан',
      text:`Правильных ответов: ${correct} из ${total} (${Math.round(rate * 100)}%).<br>Нужно минимум: ${Math.round(passRate * 100)}%.<br><br>Возвращайся, когда подучишься.`,
      btn:'На карту',
      onBtn: () => { closeModal(); switchMain('map'); renderMap(); }
    });
    return;
  }

  // Успех
  state.stats.examsPassed++;
  if (!state.passedExams.includes(battle.examId)){
    state.passedExams.push(battle.examId);
  }

  // Определяем ранг
  const rank = RANKS.find(r => r.reqExam === battle.examId);
  if (rank){
    state.rank = rank.id;
  }

  state.level += 2;
  state.hp = state.maxHp;
  updateHud(); save();
  $('#enemyArea').classList.remove('dummy', 'peaceful');

  // Особый случай — SSS (финал)
  if (state.rank === 'SSS'){
    showModal({
      title:'👑 Ранг SSS!',
      text:`Ты сдал высший экзамен. Правильных ответов: ${correct} из ${total} (${Math.round(rate * 100)}%).<br><br>Ты говоришь на уровне носителя. Ты — Легенда.`,
      rewards: { '⭐': '+2 Lv', '👑': 'SSS' },
      btn:'Продолжить',
      onBtn: () => { closeModal(); switchMain('map'); renderMap(); }
    });
    return;
  }

  showModal({
    title:`🎖️ Ранг ${state.rank}!`,
    text:`Ты сдал экзамен с результатом ${correct} из ${total} (${Math.round(rate * 100)}%).<br><br><em>${rank ? rank.desc : ''}</em>`,
    rewards: { '⭐': '+2 Lv', '🎖️': state.rank },
    btn:'На карту',
    onBtn: () => { closeModal(); switchMain('map'); renderMap(); }
  });
}

// Переопределяем renderAct4Map для учёта новой системы рангов
renderAct4Map = function(){
  const c = $('#mapScroll');
  c.innerHTML = '';

  if (!state.act4.joined){
    const banner = document.createElement('div');
    banner.className = 'banner';
    banner.innerHTML = `<h2>⚔️ Гильдия авантюристов</h2><p>Только сильные становятся легендами.</p>`;
    c.appendChild(banner);

    const info = document.createElement('div');
    info.className = 'speech';
    info.innerHTML = `
      <div class="npc-name">🗣️ Голос за дверью</div>
      <div class="en">"Who goes there? State your name!"</div>
      <div class="ru">Кто там? Назови себя!</div>
    `;
    c.appendChild(info);

    const div = document.createElement('div');
    div.className = 'stage-card exam available';
    div.innerHTML = `
      <div class="sico">⚔️</div>
      <div class="info"><h3>Войти в Гильдию</h3><p>Мастер Варан принимает новичков</p></div>
      <div class="sstate">💬</div>
    `;
    div.onclick = () => startGuildMasterIntro();
    c.appendChild(div);
    return;
  }

  // Шапка с рангом
  const currentRank = state.rank ? RANKS.find(r => r.id === state.rank) : null;
  const banner = document.createElement('div');
  banner.className = 'banner';
  banner.innerHTML = `
    <h2>⚔️ Гильдия авантюристов</h2>
    <p>Ранг: <b style="color:${currentRank ? currentRank.color : 'var(--muted)'}">${state.rank || '—'}</b>
    ${currentRank ? ` · ${currentRank.title}` : ''}</p>
  `;
  c.appendChild(banner);

  // Прогресс слов для следующего ранга
  if (currentRank){
    const nextIdx = RANKS.findIndex(r => r.id === state.rank) + 1;
    if (nextIdx < RANKS.length){
      const next = RANKS[nextIdx];
      const progress = Math.min(100, state.learned.length / next.reqWords * 100);
      const prog = document.createElement('div');
      prog.className = 'speech';
      prog.innerHTML = `
        <div class="npc-name">📊 Прогресс к рангу ${next.id}</div>
        <div class="ru" style="margin-bottom:6px">Слов: ${state.learned.length} / ${next.reqWords}</div>
        <div style="height:8px;background:#000;border-radius:4px;overflow:hidden">
          <div style="height:100%;width:${progress}%;background:linear-gradient(90deg,#22d3ee,#8b5cf6)"></div>
        </div>
      `;
      c.appendChild(prog);
    }
  }

  // Модули Гильдии
  const title = document.createElement('div');
  title.className = 'section-title';
  title.textContent = `Задания Гильдии — ${state.act4.completedModules.length} / 6`;
  c.appendChild(title);

  ACT4_MODULES.forEach((m, i) => {
    const done = state.act4.completedModules.includes(m.id);
    const unlocked = i === 0 || state.act4.completedModules.includes(ACT4_MODULES[i-1].id);
    const div = document.createElement('div');
    div.className = 'stage-card' + (done ? ' done' : '') + (unlocked ? ' available' : ' locked');
    div.innerHTML = `
      <div class="sico">${m.icon}</div>
      <div class="info">
        <h3>${i+1}. ${m.title}</h3>
        <p>${m.words.length} слов</p>
      </div>
      <div class="sstate">${done ? '✅' : (unlocked ? '▶' : '🔒')}</div>
    `;
    if (unlocked) div.onclick = () => startGuildModule(m);
    c.appendChild(div);
  });

  // Книга заклинаний
  const spellTitle = document.createElement('div');
  spellTitle.className = 'section-title';
  spellTitle.textContent = 'Фразы-заклинания';
  c.appendChild(spellTitle);

  const spellBtn = document.createElement('div');
  spellBtn.className = 'stage-card available';
  spellBtn.innerHTML = `
    <div class="sico">✨</div>
    <div class="info"><h3>Книга заклинаний</h3><p>Открыто: ${SPELL_PHRASES.filter(sp => sp.words.every(id => state.learned.includes(id))).length} / ${SPELL_PHRASES.length}</p></div>
    <div class="sstate">📖</div>
  `;
  spellBtn.onclick = () => openSpellBook();
  c.appendChild(spellBtn);

  // Экзамены — все доступные ранги
  const examTitle = document.createElement('div');
  examTitle.className = 'section-title';
  examTitle.textContent = 'Экзамены рангов';
  c.appendChild(examTitle);

  RANKS.forEach((r, i) => {
    const passed = state.passedExams.includes(r.reqExam);
    const canTake = state.learned.length >= r.reqWords;
    // Доступен, если предыдущий ранг пройден (или это E)
    const prevRank = i === 0 ? null : RANKS[i-1];
    const prevPassed = !prevRank || state.passedExams.includes(prevRank.reqExam);
    const unlocked = prevPassed;

    const div = document.createElement('div');
    div.className = 'rank-card' + (passed ? ' done' : (!unlocked || !canTake ? ' locked' : ''));
    div.style.color = r.color;

    let status = '';
    if (passed) status = '✅';
    else if (!unlocked) status = '🔒';
    else if (!canTake) status = `🔒 ${r.reqWords} слов`;
    else status = '🏆';

    div.innerHTML = `
      <div class="r-big">${r.id}</div>
      <div class="info">
        <h3 style="color:${r.color}">${r.title}</h3>
        <p style="color:var(--muted)">${r.desc}</p>
        <p style="color:var(--muted);font-size:11px">Слов: ${r.reqWords} ${passed ? '· Сдан' : (canTake ? '· Готов' : `· У тебя ${state.learned.length}`)}</p>
      </div>
      <div class="r-status">${status}</div>
    `;
    if (!passed && unlocked && canTake){
      div.style.cursor = 'pointer';
      div.onclick = () => startRankExam(r.reqExam);
    }
    c.appendChild(div);
  });

  // Финал — только после SSS
  if (state.rank === 'SSS'){
    const finalTitle = document.createElement('div');
    finalTitle.className = 'section-title';
    finalTitle.textContent = 'Финал';
    c.appendChild(finalTitle);

    const div = document.createElement('div');
    div.className = 'stage-card exam available';
    div.style.background = 'linear-gradient(135deg, rgba(251,191,36,0.25), rgba(236,72,153,0.15))';
    div.innerHTML = `
      <div class="sico">👑</div>
      <div class="info"><h3>Построить свой город</h3><p>Ты достиг ранга SSS. Начни новую жизнь.</p></div>
      <div class="sstate">🌟</div>
    `;
    div.onclick = () => startEndgame();
    c.appendChild(div);
  }
};

// Если у игрока меньше слов, чем нужно — показываем что учить
function showExamRequirements(examId){
  const exam = RANK_EXAMS_FULL[examId];
  if (!exam) return;
  const missing = exam.words - state.learned.length;
  if (missing > 0){
    showModal({
      title:'📚 Нужно больше слов',
      text:`Для экзамена нужно <b>${exam.words}</b> слов. У тебя <b>${state.learned.length}</b>.<br><br>Не хватает: <b>${missing}</b>.`,
      btn:'Продолжить обучение',
      onBtn: closeModal
    });
  } else {
    startRankExam(examId);
  }
}

// Слушай фразу NPC на английском — выбери правильный ответ.
function freeTalk(){
  // Случайные NPC
  const NPC_LINES_FREE = [
    { npc:'Старик',           en:'Hello, my friend. How are you?',         correct:'I am good, thanks. And you?',   wrong1:'Yes, I am a tree.',      wrong2:'No, the fire is cold.' },
    { npc:'Хозяин таверны',   en:'What will you order today?',             correct:'I would like some soup, please.', wrong1:'The sky is blue.',      wrong2:'I am a wolf.' },
    { npc:'Торговец Марко',   en:'Do you want to buy this sword?',         correct:'How much does it cost?',        wrong1:'I am a man.',            wrong2:'The night is dark.' },
    { npc:'Кузнец Торн',      en:'Can you help me at the forge?',          correct:'Yes, I can help you.',          wrong1:'No, I am not a fish.',  wrong2:'The moon is full.' },
    { npc:'Жрица Мира',       en:'Do you believe in the goddess?',         correct:'Yes, I believe in her.',        wrong1:'I want to eat bread.',  wrong2:'He is very slow.' },
    { npc:'Профессор Лекс',   en:'Have you finished your homework?',       correct:'Yes, I have finished it.',      wrong1:'The rain is falling.',  wrong2:'She is my mother.' },
    { npc:'Мастер Гильдии',   en:'Are you ready for a new quest?',         correct:'Yes, I am ready.',              wrong1:'The table is brown.',   wrong2:'I am a small child.' },
    { npc:'Актёр Лиан',       en:'Do you like music?',                     correct:'Yes, I love music.',            wrong1:'No, I am not a bird.',  wrong2:'The wolf is hungry.' },
    { npc:'Писарь Клавдий',   en:'Can you read this document?',            correct:'Yes, I can read it.',           wrong1:'I want to sleep now.',  wrong2:'Two and two is four.' },
    { npc:'Горожанка Элла',   en:'Where are you from?',                    correct:'I am from another world.',      wrong1:'The wall is white.',    wrong2:'I have three legs.' },
  ];

  const line = NPC_LINES_FREE[randInt(0, NPC_LINES_FREE.length - 1)];

  const scroll = $('#choiceScroll');
  const buttons = $('#choiceButtons');
  scroll.innerHTML = '';
  buttons.innerHTML = '';

  const q = document.createElement('div');
  q.className = 'speech';
  q.innerHTML = `
    <div class="npc-name">🗣️ ${line.npc}</div>
    <div class="en">${line.en}</div>
    <div class="ru" style="font-size:11px;opacity:.6;font-style:italic;margin-top:4px">Ответь правильно по-английски</div>
  `;
  scroll.appendChild(q);

  const options = shuffle([
    { en: line.correct, correct: true },
    { en: line.wrong1,  correct: false },
    { en: line.wrong2,  correct: false },
  ]);

  options.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'primary';
    b.style.textAlign = 'left';
    b.textContent = opt.en;
    b.onclick = () => {
      $$('#choiceButtons button').forEach(x => x.disabled = true);
      if (opt.correct){
        b.style.background = 'linear-gradient(135deg,#22c55e,#16a34a)';
        speak(line.en);
        setTimeout(() => freeTalk(), 900);
      } else {
        b.style.background = 'linear-gradient(135deg,#ef4444,#dc2626)';
        state.hp -= 3;
        updateHud();
        floatText('-3', '#ef4444', '50%', '20%');
        if (state.hp <= 0) playerDies();
        else setTimeout(() => freeTalk(), 1200);
      }
    };
    buttons.appendChild(b);
  });

  switchMain('choice');
}

// Проверяем, что все ключевые функции существуют
function safeCall(fn, ...args){
  try {
    if (typeof fn === 'function') return fn(...args);
  } catch(e){
    console.error('Error in safeCall:', e);
  }
}

// Обёртка для boot с защитой от ошибок
const _origBoot = boot;
boot = function(){
  try {
    _origBoot();
  } catch(e){
    console.error('Boot error:', e);
    // Fallback — начать заново
    localStorage.removeItem('lexicon_v5');
    location.reload();
  }
};

// Обёртка для renderMap с защитой
const _origRenderMap = renderMap;
renderMap = function(){
  try {
    _origRenderMap();
